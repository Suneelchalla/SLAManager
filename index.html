<script>
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxkyfBoeoMucmQCP4lebVSxaTkvqCGqaINDS8fKfxx9Tazn5hEaE8mISYuJhWZHonm4/exec';

window.storage = {
  get: async function(k) {
    var v = localStorage.getItem(k);
    if (v !== null) return { key: k, value: v };
    if (!APPS_SCRIPT_URL) return null;
    try {
      var resp = await fetch(APPS_SCRIPT_URL + '?action=get&key=' + encodeURIComponent(k));
      var data = await resp.json();
      if (data && data.value) {
        localStorage.setItem(k, data.value);
        return data;
      }
    } catch (e) { console.warn('Apps Script get failed:', e); }
    return null;
  },
  set: async function(k, v) {
    localStorage.setItem(k, v);
    if (APPS_SCRIPT_URL) {
      try {
        fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'set', key: k, value: v })
        }).catch(function(e) { console.warn('Apps Script set failed:', e); });
      } catch (e) { console.warn('Apps Script set failed:', e); }
    }
    return { key: k, value: v };
  },
  delete: async function(k) {
    localStorage.removeItem(k);
    if (APPS_SCRIPT_URL) {
      try {
        fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'delete', key: k })
        }).catch(function(e) { console.warn('Apps Script delete failed:', e); });
      } catch (e) {}
    }
    return { key: k, deleted: true };
  },
  list: async function(p) {
    var keys = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (!p || k.startsWith(p)) keys.push(k);
    }
    return { keys: keys };
  },
  syncFromCloud: async function() {
    if (!APPS_SCRIPT_URL) return { synced: 0 };
    try {
      var resp = await fetch(APPS_SCRIPT_URL + '?action=getAll');
      var data = await resp.json();
      var count = 0;
      for (var k in data) {
        if (data.hasOwnProperty(k)) { localStorage.setItem(k, data[k]); count++; }
      }
      return { synced: count };
    } catch (e) { console.warn('Sync from cloud failed:', e); return { error: e.message }; }
  },
  syncToCloud: async function() {
    if (!APPS_SCRIPT_URL) return { saved: 0 };
    var payload = {};
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k.startsWith('sla:')) payload[k] = localStorage.getItem(k);
    }
    try {
      var resp = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'setAll', data: payload })
      });
      return await resp.json();
    } catch (e) { console.warn('Sync to cloud failed:', e); return { error: e.message }; }
  }
};
</script>

const parseHM=s=>{const[h,m]=(s||"00:00").split(":").map(Number);return h*60+(m||0);};
function dYMD(d){const t=new Date(d);return`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;}
function fDate(d){if(!d)return"—";return new Date(d).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});}
function fDT(d){if(!d)return"—";return new Date(d).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:true});}
function fDur(m){if(m==null||isNaN(m))return"—";const n=m<0,a=Math.abs(Math.round(m)),d=Math.floor(a/1440),h=Math.floor((a%1440)/60),mn=a%60;let s=n?"-":"";if(d>0)s+=d+"d ";if(h>0||d>0)s+=h+"h ";s+=mn+"m";return s.trim();}
function getBizMin(sI,eI,cfg,hs){const s=new Date(sI),e=new Date(eI);if(s>=e)return 0;const bS=parseHM(cfg.businessStart),bE=parseHM(cfg.businessEnd),is24=bS===0&&bE>=1439;let t=0,c=new Date(s);while(c<e){const dw=c.getDay(),ym=dYMD(c);if(cfg.workDays.includes(dw)&&!hs.has(ym)){let dS,dE;if(is24){dS=new Date(c.getFullYear(),c.getMonth(),c.getDate(),0,0,0);dE=new Date(c.getFullYear(),c.getMonth(),c.getDate(),23,59,59);}else{dS=new Date(c.getFullYear(),c.getMonth(),c.getDate(),Math.floor(bS/60),bS%60,0);dE=new Date(c.getFullYear(),c.getMonth(),c.getDate(),Math.floor(bE/60),bE%60,0);}const sS=c>dS?c:dS,sE=e<dE?e:dE;if(sE>sS)t+=(sE-sS)/60000;}c=new Date(c.getFullYear(),c.getMonth(),c.getDate()+1,0,0,0);}return t;}
function calcSLA(tk,cfg,hs){if(!tk.history?.length)return{totalMin:0,clientMin:0,svmMin:0,engMin:0,perOwner:{},perSide:{svm:0,client:0,engineering:0}};const now=new Date();let tM=0,cM=0,sM=0,eM=0;const pO={},pS={svm:0,client:0,engineering:0};for(let i=0;i<tk.history.length;i++){const en=tk.history[i],sd=en.side||"svm",sS=new Date(en.timestamp);const paused=sd==="client"||en.statusName==="Closed";let sE;if(i<tk.history.length-1)sE=new Date(tk.history[i+1].timestamp);else if(tk.closedAt)sE=new Date(tk.closedAt);else sE=now;const mn=getBizMin(sS,sE,cfg,hs);if(paused)cM+=mn;else if(sd==="engineering"){eM+=mn;tM+=mn;}else{sM+=mn;tM+=mn;}pS[paused?"client":sd]=(pS[paused?"client":sd]||0)+mn;const ow=en.owner||"Unassigned";if(!paused)pO[ow]=(pO[ow]||0)+mn;}return{totalMin:tM,clientMin:cM,svmMin:sM,engMin:eM,perOwner:pO,perSide:pS};}
function bLvl(el,tg){if(tg<=0)return"safe";const p=el/tg;if(p>=1)return"breached";if(p>=.9)return"danger";if(p>=.75)return"warning";return"safe";}
function bBadge(l){return{safe:{bg:"#dcfce7",tx:"#166534",lb:"On Track"},warning:{bg:"#fef3c7",tx:"#92400e",lb:"At Risk"},danger:{bg:"#fee2e2",tx:"#991b1b",lb:"Critical"},breached:{bg:"#7f1d1d",tx:"#fff",lb:"Breached"}}[l]||{bg:"#dcfce7",tx:"#166534",lb:"On Track"};}

function getPrefix(ticketNo){const s=(ticketNo||"").trim();const idx=s.indexOf("-");if(idx<=0)return"";return s.substring(0,idx).toUpperCase();}

function clientHasSLA(client,severityId){if(!client||!client.slaOverrides)return false;const val=client.slaOverrides[severityId];return val!=null&&val>0;}
function clientHasAnySLA(client){if(!client||!client.slaOverrides)return false;return Object.keys(client.slaOverrides).length>0&&Object.values(client.slaOverrides).some(v=>v!=null&&v>0);}

function getWk(d){const dt=new Date(d),j=new Date(dt.getFullYear(),0,1),w=Math.ceil(((dt-j)/864e5+j.getDay()+1)/7);return`${dt.getFullYear()}-W${String(w).padStart(2,"0")}`;}

function useStore(key,def){const[data,setData]=useState(def);const[ld,setLd]=useState(false);useEffect(()=>{(async()=>{try{const r=await window.storage.get(key);if(r&&r.value)setData(JSON.parse(r.value));}catch(e){}setLd(true);})();},[key]);const save=useCallback(async v=>{setData(v);try{await window.storage.set(key,JSON.stringify(v));}catch(e){console.error(e);}},[key]);return[data,save,ld];}

  const dp={statuses,teams,severities:sevs,modules,workflows:wfs,config:cfg,holidaySet:hs,clients,onUpdate:updTk,onDelete:delTk,notify};
  let content;
  if(selTk){const t=tickets.find(x=>x.id===selTk);content=t?<TkDetail ticket={t} {...dp} allTickets={tickets} onBack={()=>setSelTk(null)}/>:<p>Not found</p>;}
  else if(page==="dashboard")content=<Dash tickets={tickets} active={active} closed={closed} sevs={sevs} teams={teams} modules={modules} cfg={cfg} hs={hs} clients={clients} onNav={nav} onSel={setSelTk}/>;
  else if(page==="tickets")content=<TkList tickets={active} sevs={sevs} teams={teams} modules={modules} wfs={wfs} statuses={statuses} cfg={cfg} hs={hs} clients={clients} onSel={setSelTk} allTix={tickets} onCreate={t=>{saveTix([...tickets,t]);notify("Ticket "+t.ticketNo+" created");}} onBulk={arr=>{saveTix([...tickets,...arr]);notify(arr.length+" tickets imported");}} onQuickStatus={(u,m)=>{updTk(u,m);}}/>;
  else if(page==="escalations")content=<EscPanel tickets={escTix} sevs={sevs} teams={teams} cfg={cfg} hs={hs} clients={clients} onSel={setSelTk}/>;
  else if(page==="report")content=<Report tickets={tickets} sevs={sevs} teams={teams} modules={modules} wfs={wfs} cfg={cfg} hs={hs} clients={clients} onSel={setSelTk} notify={notify}/>;
  else if(page==="analytics")content=<Analytics tickets={tickets} active={active} closed={closed} sevs={sevs} teams={teams} modules={modules} cfg={cfg} hs={hs} clients={clients} sub={sub} setSub={setSub}/>;
  else if(page==="settings")content=<Sett cfg={cfg} saveCfg={v=>{saveCfg(v);notify("Settings saved");}} holidays={holidays} saveHol={v=>{saveHol(v);notify("Holidays updated");}} statuses={statuses} saveSts={v=>{saveSts(v);notify("Statuses updated");}} teams={teams} saveTms={v=>{saveTms(v);notify("Teams updated");}} modules={modules} saveMods={v=>{saveMods(v);notify("Modules updated");}} sevs={sevs} saveSevs={v=>{saveSevs(v);notify("Severity updated");}} wfs={wfs} saveWfs={v=>{saveWfs(v);notify("Workflows updated");}} clients={clients} saveClients={v=>{saveClients(v);notify("Clients updated");}} allData={{config:cfg,holidays,statuses,teams,modules,severities:sevs,tickets,workflows:wfs,clients}} onRestore={async d=>{if(d.config)await saveCfg(d.config);if(d.holidays)await saveHol(d.holidays);if(d.statuses)await saveSts(d.statuses);if(d.teams)await saveTms(d.teams);if(d.modules)await saveMods(d.modules);if(d.severities)await saveSevs(d.severities);if(d.tickets)await saveTix(d.tickets);if(d.workflows)await saveWfs(d.workflows);if(d.clients)await saveClients(d.clients);notify("Data restored");}} sub={sub} setSub={setSub} notify={notify}/>;
  return <div style={{fontFamily:"'Inter',system-ui,sans-serif",background:"#f4f6fa",minHeight:"100vh"}}>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <div style={{width:220,background:"#0f172a",color:"#e2e8f0",display:"flex",flexDirection:"column",height:"100vh",position:"fixed",left:0,top:0,zIndex:200,transform:sideOpen?"translateX(0)":"translateX(-220px)",transition:"transform .2s"}}>
      <div style={{padding:"18px 16px 10px",borderBottom:"1px solid #1e293b"}}><div style={{display:"flex",alignItems:"center",gap:9}}><Shield size={20} color="#818cf8"/><span style={{fontWeight:800,fontSize:16}}>SLA Manager</span></div><div style={{fontSize:10,color:"#64748b",marginTop:5}}>Resolution Tracker · v2</div></div>
      <nav style={{flex:1,padding:"10px 8px",display:"flex",flexDirection:"column",gap:1}}>{ni.map(it=><div key={it.id}><button onClick={()=>nav(it.id)} style={{display:"flex",alignItems:"center",gap:9,padding:"9px 11px",borderRadius:7,border:"none",background:page===it.id?"#1e293b":"transparent",color:page===it.id?"#fff":"#94a3b8",cursor:"pointer",width:"100%",textAlign:"left",fontSize:13,fontWeight:page===it.id?700:500}}><it.icon size={17}/><span style={{flex:1}}>{it.label}</span>{it.count!=null&&<span style={{background:page===it.id?"#4f46e5":"#334155",padding:"1px 7px",borderRadius:10,fontSize:10,fontWeight:700}}>{it.count}</span>}</button>{it.id==="tickets"&&sevDots.length>0&&<div style={{display:"flex",gap:4,paddingLeft:38,paddingBottom:4,flexWrap:"wrap"}}>{sevDots.map(s=><span key={s.id} style={{fontSize:9,padding:"1px 6px",borderRadius:6,background:s.color+"33",color:s.color,fontWeight:700}}>{sevCounts[s.id]} {s.name}</span>)}</div>}</div>)}</nav>
      {alerts.length>0&&<div style={{padding:"10px 14px",borderTop:"1px solid #1e293b"}}><div onClick={()=>nav("tickets")} style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"#fbbf24",fontWeight:600,cursor:"pointer"}}><Bell size={14}/>{alerts.length} need attention</div></div>}
      <div style={{padding:"10px 16px",borderTop:"1px solid #1e293b",fontSize:10,color:"#475569"}}>24/5 Mon-Fri · IST</div>
    </div>
    <div style={{marginLeft:sW,transition:"margin-left .2s",minHeight:"100vh"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,padding:"12px 24px",background:"#fff",borderBottom:"1px solid #e9ecf2",position:"sticky",top:0,zIndex:100}}>
        <button onClick={()=>setSideOpen(!sideOpen)} style={{background:"none",border:"none",cursor:"pointer",padding:4}}><Menu size={20} color="#475569"/></button>
        <div style={{flex:1}}/>
        {alerts.length>0&&<div onClick={()=>nav("tickets")} style={{display:"flex",alignItems:"center",gap:6,padding:"5px 12px",background:"#fef3c7",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600,color:"#92400e"}}><AlertTriangle size={14}/>{alerts.length} approaching/breached</div>}
        <span style={{fontSize:12,color:"#94a3b8"}}>{new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata",day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}</span>
      </div>
      <div style={{padding:"20px 28px"}}>{content}</div>
    </div>
    {toast&&<div style={{position:"fixed",bottom:24,right:24,zIndex:9999,padding:"12px 20px",borderRadius:10,fontSize:13,fontWeight:600,boxShadow:"0 8px 24px rgba(0,0,0,.15)",display:"flex",alignItems:"center",gap:8,animation:"slideUp .25s ease",background:toast.type==="error"?"#fee2e2":toast.type==="info"?"#e0f2fe":"#dcfce7",color:toast.type==="error"?"#991b1b":toast.type==="info"?"#0c4a6e":"#166534"}}>{toast.type==="error"?<XCircle size={16}/>:toast.type==="info"?<Bell size={16}/>:<CheckCircle size={16}/>}{toast.msg}<style>{`@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}`}</style></div>}
  </div>;
}

function QSC({ticket:tk,statuses,teams,onUpdate,notify}){
  const[open,setOpen]=useState(false);const[selSt,setSelSt]=useState(null);const[ts,setTs]=useState("");const[note,setNote]=useState("");
  const curStId=tk.history?.[tk.history.length-1]?.statusId;
  const wSts=statuses.filter(s=>s.workflows?.includes(tk.workflow)&&s.id!==curStId&&s.name!=="Closed");
  const localNow=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}T${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;};
  const pickSt=(s)=>{setSelSt(s);setTs(localNow());setNote("");};
  const lTs=tk.history?.[tk.history.length-1]?.timestamp;const tsErr=lTs&&new Date(ts)<new Date(lTs);
  const confirm=()=>{if(!selSt||tsErr)return;const n=new Date(ts).toISOString();const forceSide=selSt.name==="Closed"?"svm":selSt.side;const newEntry={id:uid(),statusId:selSt.id,statusName:selSt.name,side:forceSide,owner:tk.currentOwner,team:tk.currentTeam,timestamp:n,note:note||"Quick status change"};const newH=[...tk.history,newEntry];const isClosed=selSt.name==="Closed";const isRes=selSt.name.toLowerCase().includes("resolved")||selSt.name.toLowerCase().includes("delivered")||selSt.name.toLowerCase().includes("completed");onUpdate({...tk,history:newH,closedAt:isClosed?n:tk.closedAt,resolvedAt:isRes?n:tk.resolvedAt},"Status → "+selSt.name);setOpen(false);setSelSt(null);};
  return <div style={{position:"relative"}} onClick={e=>e.stopPropagation()}>
    <button onClick={()=>{setOpen(!open);setSelSt(null);}} style={{background:"#f1f5f9",border:"1px solid #e2e8f0",borderRadius:5,padding:"3px 7px",fontSize:10,fontWeight:600,color:"#475569",cursor:"pointer",display:"flex",alignItems:"center",gap:3}}><RefreshCw size={10}/>Move</button>
    {open&&<div style={{position:"absolute",top:"100%",right:0,marginTop:4,background:"#fff",border:"1px solid #e2e8f0",borderRadius:8,boxShadow:"0 8px 24px rgba(0,0,0,.12)",zIndex:50,minWidth:250,maxHeight:350,overflow:"auto"}}>
      {!selSt?<>{["svm","engineering","client"].map(side=>{const items=wSts.filter(s=>s.side===side);if(!items.length)return null;return <div key={side}><div style={{padding:"5px 10px",fontSize:10,fontWeight:700,color:SC[side],background:SC[side]+"11",borderBottom:"1px solid #f1f5f9"}}>{SL[side]} ({side==="client"?"Paused":"Runs"})</div>{items.map(s=><div key={s.id} onClick={()=>pickSt(s)} style={{padding:"6px 12px",fontSize:12,cursor:"pointer",borderBottom:"1px solid #f8fafc"}} onMouseEnter={e=>e.target.style.background="#f1f5f9"} onMouseLeave={e=>e.target.style.background="transparent"}>{s.name}</div>)}</div>;})}</>
      :<div style={{padding:10,display:"flex",flexDirection:"column",gap:8}}>
        <div style={{fontSize:12,fontWeight:700}}>→ {selSt.name} <SBdg side={selSt.side}/></div>
        <div><label style={{fontSize:10,fontWeight:600,color:"#64748b"}}>Date & Time</label><input type="datetime-local" value={ts} onChange={e=>setTs(e.target.value)} style={{width:"100%",padding:"5px 8px",borderRadius:5,border:"1px solid "+(tsErr?"#dc2626":"#e2e8f0"),fontSize:12,boxSizing:"border-box"}}/>{tsErr&&<div style={{fontSize:10,color:"#dc2626",marginTop:2}}>Must be after {fDT(lTs)}</div>}</div>
        <input value={note} onChange={e=>setNote(e.target.value)} placeholder="Note (optional)" style={{padding:"5px 8px",borderRadius:5,border:"1px solid #e2e8f0",fontSize:12}}/>
        <div style={{display:"flex",gap:6,justifyContent:"flex-end"}}><button onClick={()=>setSelSt(null)} style={{padding:"4px 10px",borderRadius:5,border:"1px solid #e2e8f0",background:"#fff",fontSize:11,fontWeight:600,cursor:"pointer"}}>Back</button><button onClick={confirm} disabled={tsErr} style={{padding:"4px 10px",borderRadius:5,border:"none",background:tsErr?"#94a3b8":"#4f46e5",color:"#fff",fontSize:11,fontWeight:600,cursor:tsErr?"not-allowed":"pointer"}}>Confirm</button></div>
      </div>}
    </div>}
  </div>;
}

function OwnerDash({active,sevs,cfg,hs,clients}){
  const data=useMemo(()=>{const m={};active.forEach(t=>{const ow=t.currentOwner||"Unassigned";if(!m[ow])m[ow]={owner:ow,total:0,safe:0,warning:0,danger:0,breached:0};m[ow].total++;const sla=calcSLA(t,cfg,hs),tg=getTgt(t,sevs,clients),lv=bLvl(sla.totalMin,tg);m[ow][lv]++;});return Object.values(m).sort((a,b)=>(b.breached+b.danger)-(a.breached+a.danger));},[active,sevs,cfg,hs,clients]);
  if(!data.length)return null;
  return <Card style={{marginBottom:16}}>
    <h3 style={{margin:"0 0 12px",fontSize:14,fontWeight:700,display:"flex",alignItems:"center",gap:7}}><Users size={16}/>Owner Workload & Health</h3>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:10}}>
      {data.map(d=>{const atRisk=d.warning+d.danger+d.breached;const rating=d.total===0?"—":d.breached>0?"Needs Help":atRisk>0?"Watch":"Good";const rColor=d.breached>0?"#dc2626":atRisk>0?"#d97706":"#10b981";
        return <div key={d.owner} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:d.breached>0?"#fef2f2":atRisk>0?"#fffbeb":"#f0fdf4",borderRadius:8,border:"1px solid "+(d.breached>0?"#fecaca":atRisk>0?"#fde68a":"#bbf7d0")}}>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:13,color:"#0f172a"}}>{d.owner}</div>
            <div style={{display:"flex",gap:6,marginTop:4}}>
              {d.safe>0&&<Bdg bg="#dcfce7" color="#166534">{d.safe} on track</Bdg>}
              {d.warning>0&&<Bdg bg="#fef3c7" color="#92400e">{d.warning} at risk</Bdg>}
              {d.danger>0&&<Bdg bg="#fee2e2" color="#991b1b">{d.danger} critical</Bdg>}
              {d.breached>0&&<Bdg bg="#7f1d1d" color="#fff">{d.breached} breached</Bdg>}
            </div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:18,fontWeight:800,color:"#0f172a"}}>{d.total}</div>
            <div style={{fontSize:10,fontWeight:700,color:rColor}}>{rating}</div>
          </div>
        </div>;
      })}
    </div>
  </Card>;
}

function Dash({tickets,active,closed,sevs,teams,modules,cfg,hs,clients,onNav,onSel}){
  const[now,setNow]=useState(Date.now());const[dF,setDF]=useState("");const[dT,setDT]=useState("");
  useEffect(()=>{const iv=setInterval(()=>setNow(Date.now()),60000);return()=>clearInterval(iv);},[]);
  const fClosed=useMemo(()=>closed.filter(t=>{if(dF&&t.closedAt<dF)return false;if(dT&&t.closedAt>dT+"T23:59:59")return false;return true;}),[closed,dF,dT]);
  const stats=useMemo(()=>{let br=0,ar=0,ok=0,esc=0;active.forEach(t=>{const sla=calcSLA(t,cfg,hs),lv=bLvl(sla.totalMin,getTgt(t,sevs,clients));if(lv==="breached")br++;else if(lv==="danger"||lv==="warning")ar++;else ok++;if(t.isEscalated)esc++;});let cb=0;let totalResMin=0;fClosed.forEach(t=>{const sla=calcSLA(t,cfg,hs),tg=getTgt(t,sevs,clients);if(sla.totalMin>tg)cb++;totalResMin+=sla.totalMin;});const avgRes=fClosed.length?Math.round(totalResMin/fClosed.length):0;return{br,ar,ok,esc,cb,comp:fClosed.length?Math.round(((fClosed.length-cb)/fClosed.length)*100):0,avgRes};},[active,fClosed,sevs,cfg,hs,now]);
  const sevCh=useMemo(()=>sevs.map(s=>({name:s.name,active:active.filter(t=>t.severity===s.id).length,closed:fClosed.filter(t=>t.severity===s.id).length})),[active,fClosed,sevs]);
  const sideCh=useMemo(()=>{let sv=0,cl=0,en=0;active.forEach(t=>{const l=t.history?.[t.history.length-1];if(l?.side==="client")cl++;else if(l?.side==="engineering")en++;else sv++;});return[{name:"SVM",value:sv,color:SC.svm},{name:"Client",value:cl,color:SC.client},{name:"Engineering",value:en,color:SC.engineering}].filter(x=>x.value>0);},[active]);
  const brList=useMemo(()=>active.filter(t=>{const sla=calcSLA(t,cfg,hs),tg=getTgt(t,sevs,clients);return sla.totalMin>tg;}).sort((a,b)=>{const sa=calcSLA(a,cfg,hs),sb=calcSLA(b,cfg,hs),tgA=getTgt(a,sevs,clients),tgB=getTgt(b,sevs,clients);return(sb.totalMin-tgB)-(sa.totalMin-tgA);}).slice(0,8),[active,sevs,cfg,hs,now]);
  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20,flexWrap:"wrap",gap:12}}>
      <div><h1 style={{fontSize:22,fontWeight:800,color:"#0f172a",margin:0}}>Dashboard</h1><p style={{color:"#64748b",fontSize:13,margin:"3px 0 0"}}>SLA overview</p></div>
      <DR from={dF} to={dT} setFrom={setDF} setTo={setDT}/>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(175px,1fr))",gap:14,marginBottom:24}}>
      <KPI icon={Ticket} label="Active" value={active.length} accent="#4f46e5"/>
      <KPI icon={CheckCircle} label="On Track" value={stats.ok} accent="#10b981"/>
      <KPI icon={AlertTriangle} label="At Risk" value={stats.ar} accent="#f59e0b"/>
      <KPI icon={XCircle} label="Breached" value={stats.br} accent="#dc2626"/>
      <KPI icon={TrendingUp} label="Compliance" value={fClosed.length>0?`${stats.comp}%`:"—"} sub={fClosed.length>0?`${fClosed.length} closed`:"No closed tickets"} accent={stats.comp>=90?"#10b981":stats.comp>=75?"#f59e0b":"#dc2626"}/>
      <KPI icon={Flag} label="Escalated" value={stats.esc} accent="#ea580c"/>
      <KPI icon={Clock} label="Avg Resolution" value={fDur(stats.avgRes)} sub="closed tickets" accent="#6366f1"/>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:24}}>
      <Card><h3 style={{margin:"0 0 14px",fontSize:14,fontWeight:700}}>By Severity</h3><ResponsiveContainer width="100%" height={200}><BarChart data={sevCh}><CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9"/><XAxis dataKey="name" fontSize={11}/><YAxis fontSize={11} allowDecimals={false}/><Tooltip/><Bar dataKey="active" fill="#4f46e5" name="Active" radius={[3,3,0,0]}/><Bar dataKey="closed" fill="#10b981" name="Closed" radius={[3,3,0,0]}/></BarChart></ResponsiveContainer></Card>
      <Card><h3 style={{margin:"0 0 14px",fontSize:14,fontWeight:700}}>Active by Side</h3>{sideCh.length?<ResponsiveContainer width="100%" height={200}><PieChart><Pie data={sideCh} cx="50%" cy="50%" outerRadius={75} dataKey="value" label={({name,value})=>`${name}: ${value}`}>{sideCh.map((e,i)=><Cell key={i} fill={e.color}/>)}</Pie><Tooltip/></PieChart></ResponsiveContainer>:<div style={{textAlign:"center",padding:40,color:"#94a3b8"}}>No active tickets</div>}</Card>
    </div>
    {active.length>0&&<OwnerDash active={active} sevs={sevs} cfg={cfg} hs={hs} clients={clients}/>}
    {active.length>0&&<Card style={{marginBottom:16}}><h3 style={{margin:"0 0 12px",fontSize:14,fontWeight:700,display:"flex",alignItems:"center",gap:7}}><Clock size={16} color="#4f46e5"/>Priority Queue — Work on Next</h3><div style={{display:"flex",flexDirection:"column",gap:5}}>{[...active].map(t=>({...t,sla:calcSLA(t,cfg,hs),tg:getTgt(t,sevs,clients)})).map(t=>({...t,rm:t.tg-t.sla.totalMin,lv:bLvl(t.sla.totalMin,t.tg)})).sort((a,b)=>{const p={breached:0,danger:1,warning:2,safe:3};if(p[a.lv]!==p[b.lv])return p[a.lv]-p[b.lv];return a.rm-b.rm;}).slice(0,6).map((t,i)=>{const sv=sevs.find(s=>s.id===t.severity);const bb=bBadge(t.lv);return <div key={t.id} onClick={()=>onSel(t.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",background:i===0?(t.lv==="breached"?"#fef2f2":"#f0f9ff"):"#fff",borderRadius:8,cursor:"pointer",border:"1px solid "+(i===0?"#c7d2fe":"#f1f5f9")}}><span style={{fontSize:16,fontWeight:800,color:i===0?"#4f46e5":"#94a3b8",minWidth:22}}>#{i+1}</span><Bdg bg={sv?.color+"22"} color={sv?.color}>{sv?.name}</Bdg><span style={{fontWeight:700,fontSize:13,minWidth:100}}><JiraLink ticketNo={t.ticketNo} cfg={cfg}/></span><span style={{flex:1,fontSize:12,color:"#475569",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.title}</span><Bdg bg={bb.bg} color={bb.tx}>{bb.lb}</Bdg><span style={{fontSize:12,fontWeight:700,color:t.lv==="breached"?"#dc2626":"#0f172a",fontVariantNumeric:"tabular-nums",minWidth:80,textAlign:"right"}}>{t.lv==="breached"?"+"+fDur(Math.abs(t.rm)):fDur(t.rm)+" left"}</span><ChevronRight size={14} color="#94a3b8"/></div>;})}</div></Card>}

function CrtForm({statuses,teams,modules,sevs,wfs,clients,allTix,onSave,onCancel}){

        {prefixInvalid&&<div style={{fontSize:11,color:"#dc2626",fontWeight:600,marginTop:3}}>Prefix "{prefix}" does not match any client. Valid: {allPrefixes}</div>}
        {!hasPrefix&&f.ticketNo.trim().length>0&&<div style={{fontSize:11,color:"#d97706",fontWeight:600,marginTop:3}}>Ticket must start with a client prefix followed by dash (e.g. SWIPHX-1234)</div>}
      </div>

    </div>

    {/* Client auto-detection display */}
    <div style={{padding:"10px 14px",borderRadius:8,border:"1px solid "+(prefixValid?"#bbf7d0":prefixInvalid?"#fecaca":"#e2e8f0"),background:prefixValid?"#f0fdf4":prefixInvalid?"#fef2f2":"#f8fafc",display:"flex",alignItems:"center",gap:10}}>
      <Link2 size={16} color={prefixValid?"#10b981":prefixInvalid?"#dc2626":"#94a3b8"}/>
      {prefixValid?<div>
        <div style={{fontSize:13,fontWeight:700,color:"#166534"}}>Client: <span style={{color:"#4f46e5"}}>[{detectedClient.prefix}]</span> {detectedClient.name}</div>

    {/* Validation summary */}

  </div>;
}

function HEditForm({entry,idx,total,prevTs,nextTs,statuses,teams,wf,onSave,onCancel}){

// REPORT
function Report({tickets,sevs,teams,modules,wfs,cfg,hs,clients,onSel,notify}){
  const[dF,setDF]=useState("");const[dT,setDT]=useState("");const[fS,setFS]=useState("");const[fT,setFT]=useState("");const[fCl,setFCl]=useState("");const[stTab,setStTab]=useState("all");
  const[pg,setPg]=useState(1);const[sort,setSort]=useState({key:"urgency",dir:"asc"});
  const enr=useMemo(()=>tickets.map(t=>{const sla=calcSLA(t,cfg,hs),tg=getTgt(t,sevs,clients),sv=sevs.find(s=>s.id===t.severity),lv=bLvl(sla.totalMin,tg);return{...t,sla,tg,sv,lv,met:sla.totalMin<=tg,isActive:!t.closedAt};}),[tickets,sevs,cfg,hs,clients]);
  const filt=useMemo(()=>enr.filter(t=>{if(stTab==="active"&&!t.isActive)return false;if(stTab==="closed"&&t.isActive)return false;if(dF){const ref=t.closedAt||t.createdAt;if(ref<dF)return false;}if(dT){const ref=t.closedAt||t.createdAt;if(ref>dT+"T23:59:59")return false;}if(fS&&t.severity!==fS)return false;if(fT&&t.currentTeam!==fT)return false;if(fCl&&t.client!==fCl)return false;return true;}),[enr,dF,dT,fS,fT,fCl,stTab]);
  const srt=useMemo(()=>[...filt].sort((a,b)=>{const d=sort.dir==="asc"?1:-1;if(sort.key==="ticket")return a.ticketNo.localeCompare(b.ticketNo)*d;if(sort.key==="severity")return((a.sv?.resolutionHours||999)-(b.sv?.resolutionHours||999))*d;if(sort.key==="elapsed")return(a.sla.totalMin-b.sla.totalMin)*d;if(sort.key==="target")return(a.tg-b.tg)*d;if(sort.key==="urgency"){const rm=x=>x.tg-x.sla.totalMin;return(rm(a)-rm(b))*d;}if(sort.key==="date"){const da=new Date(a.closedAt||a.createdAt),db=new Date(b.closedAt||b.createdAt);return(da-db)*d;}return 0;}),[filt,sort]);
  const pgd=srt.slice((pg-1)*PGS,pg*PGS);useEffect(()=>setPg(1),[dF,dT,fS,fT,fCl,sort,stTab]);
  const sm=useMemo(()=>{let m=0,b=0,tr=0,actBr=0;filt.forEach(t=>{if(t.met)m++;else b++;tr+=t.sla.totalMin;if(t.isActive&&!t.met)actBr++;});return{met:m,breached:b,total:filt.length,actBr,comp:filt.length?Math.round(m/filt.length*100):0,avg:filt.length?Math.round(tr/filt.length):0};},[filt]);
  const hExp=()=>{const rows=filt.map(t=>{const tm=teams.find(x=>x.id===t.currentTeam),wf=wfs.find(w=>w.id===t.workflow),cl=clients?.find(c=>c.id===t.client);return{"Ticket No":t.ticketNo,Title:t.title,Status:t.isActive?"Active":"Closed",Client:cl?.name||"—",Prefix:cl?.prefix||"—",Severity:t.sv?.name||"","Target hrs":+(t.tg/60).toFixed(1),"Elapsed hrs":+(t.sla.totalMin/60).toFixed(2),"SVM hrs":+(t.sla.svmMin/60).toFixed(2),"Client hrs":+(t.sla.clientMin/60).toFixed(2),"Eng hrs":+(t.sla.engMin/60).toFixed(2),Result:t.met?"Met":"Breached","SLA Level":bBadge(t.lv).lb,Team:tm?.name||"",Workflow:wf?.name||"",Owner:t.currentOwner,Created:fDT(t.createdAt),Closed:t.closedAt?fDT(t.closedAt):"—"};});const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"SLA Report");ws["!cols"]=Object.keys(rows[0]||{}).map(k=>({wch:Math.max(k.length,14)}));XLSX.writeFile(wb,`SLA_Report_${dYMD(new Date())}.xlsx`);};
  const tabStyle=(id)=>({padding:"7px 16px",borderRadius:8,border:"none",fontWeight:600,fontSize:13,cursor:"pointer",background:stTab===id?"#4f46e5":"#f1f5f9",color:stTab===id?"#fff":"#475569"});
  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16,flexWrap:"wrap",gap:12}}>
      <div><h1 style={{fontSize:22,fontWeight:800,margin:0}}>SLA Report</h1><p style={{color:"#64748b",fontSize:13,margin:"3px 0 0"}}>{filt.length} tickets</p></div>
      <div style={{display:"flex",gap:8,alignItems:"flex-end"}}><DR from={dF} to={dT} setFrom={setDF} setTo={setDT}/><Btn variant="ghost" small onClick={hExp}><Download size={14}/>Export</Btn></div>
    </div>
    <div style={{display:"flex",gap:6,marginBottom:14}}>
      <button onClick={()=>setStTab("all")} style={tabStyle("all")}>All ({enr.length})</button>
      <button onClick={()=>setStTab("active")} style={tabStyle("active")}>Active ({enr.filter(t=>t.isActive).length})</button>
      <button onClick={()=>setStTab("closed")} style={tabStyle("closed")}>Closed ({enr.filter(t=>!t.isActive).length})</button>
    </div>
    <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
      <Sel value={fCl} onChange={e=>setFCl(e.target.value)} options={[{value:"",label:"All Clients"},...clients.map(c=>({value:c.id,label:`[${c.prefix||"?"}] ${c.name}`}))]}/>
      <Sel value={fS} onChange={e=>setFS(e.target.value)} options={[{value:"",label:"All Severities"},...sevs.map(s=>({value:s.id,label:s.name}))]}/>
      <Sel value={fT} onChange={e=>setFT(e.target.value)} options={[{value:"",label:"All Teams"},...teams.map(t=>({value:t.id,label:t.name}))]}/>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,marginBottom:18}}>
      <KPI icon={CheckCircle} label="SLA Met" value={sm.met} accent="#10b981"/>
      <KPI icon={XCircle} label="Breached" value={sm.breached} accent="#dc2626"/>
      <KPI icon={Shield} label="Compliance" value={sm.total>0?`${sm.comp}%`:"—"} sub={sm.total>0?`${sm.total} tickets`:"No tickets"} accent={sm.comp>=90?"#10b981":sm.comp>=75?"#f59e0b":"#dc2626"}/>
      <KPI icon={Clock} label="Avg Elapsed" value={sm.total>0?fDur(sm.avg):"—"} accent="#6366f1"/>
    </div>
    {sm.actBr>0&&<div style={{padding:"12px 16px",background:"#fef2f2",borderRadius:10,border:"1px solid #fecaca",marginBottom:16,display:"flex",alignItems:"center",gap:10}}><AlertTriangle size={18} color="#dc2626"/><div><div style={{fontSize:13,fontWeight:700,color:"#991b1b"}}>{sm.actBr} active ticket{sm.actBr>1?"s":""} currently breaching SLA</div><div style={{fontSize:11,color:"#dc2626"}}>These tickets have exceeded their SLA target and are still open.</div></div></div>}
    {pgd.length===0?<Card style={{textAlign:"center",padding:44,color:"#94a3b8"}}>No tickets match filters.</Card>:
    <div style={{overflow:"auto",border:"1px solid #e2e8f0",borderRadius:10,marginBottom:8}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}><thead><tr><STH label="Ticket" sk="ticket" sort={sort} setSort={setSort}/><th style={{textAlign:"left",padding:"9px 12px",background:"#f8fafc",borderBottom:"2px solid #e2e8f0",fontWeight:700,color:"#475569",fontSize:11}}>Title</th><th style={{textAlign:"left",padding:"9px 12px",background:"#f8fafc",borderBottom:"2px solid #e2e8f0",fontWeight:700,color:"#475569",fontSize:11}}>Client</th><th style={{textAlign:"left",padding:"9px 12px",background:"#f8fafc",borderBottom:"2px solid #e2e8f0",fontWeight:700,color:"#475569",fontSize:11}}>Status</th><STH label="Severity" sk="severity" sort={sort} setSort={setSort}/><STH label="Target" sk="target" sort={sort} setSort={setSort}/><STH label="Elapsed" sk="elapsed" sort={sort} setSort={setSort}/><th style={{textAlign:"left",padding:"9px 12px",background:"#f8fafc",borderBottom:"2px solid #e2e8f0",fontWeight:700,color:"#475569",fontSize:11}}>SVM/Eng/Client</th><th style={{textAlign:"left",padding:"9px 12px",background:"#f8fafc",borderBottom:"2px solid #e2e8f0",fontWeight:700,color:"#475569",fontSize:11}}>Result</th><STH label="Date" sk="date" sort={sort} setSort={setSort}/></tr></thead>
    <tbody>{pgd.map(t=>{const tm=teams.find(x=>x.id===t.currentTeam);const cl=clients?.find(c=>c.id===t.client);const bb=bBadge(t.lv);return <tr key={t.id} onClick={()=>onSel(t.id)} style={{cursor:"pointer",background:t.isActive&&!t.met?"#fef2f2":"transparent"}} onMouseEnter={e=>{if(!(t.isActive&&!t.met))e.currentTarget.style.background="#f8fafc"}} onMouseLeave={e=>e.currentTarget.style.background=t.isActive&&!t.met?"#fef2f2":"transparent"}>
      <td style={{padding:"8px 12px",borderBottom:"1px solid #f1f5f9",fontWeight:700}}><JiraLink ticketNo={t.ticketNo} cfg={cfg}/></td>
      <td style={{padding:"8px 12px",borderBottom:"1px solid #f1f5f9",maxWidth:200,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.title}</td>
      <td style={{padding:"8px 12px",borderBottom:"1px solid #f1f5f9"}}>{cl?<span style={{color:"#4f46e5",fontWeight:600}}>[{cl.prefix}] {cl.name}</span>:"—"}</td>
      <td style={{padding:"8px 12px",borderBottom:"1px solid #f1f5f9"}}>{t.isActive?<Bdg bg="#dbeafe" color="#1e40af">Active</Bdg>:<Bdg bg="#e2e8f0" color="#475569">Closed</Bdg>}</td>
      <td style={{padding:"8px 12px",borderBottom:"1px solid #f1f5f9"}}><Bdg bg={t.sv?.color+"22"} color={t.sv?.color}>{t.sv?.name}</Bdg></td>
      <td style={{padding:"8px 12px",borderBottom:"1px solid #f1f5f9",fontVariantNumeric:"tabular-nums"}}>{fDur(t.tg)}</td>
      <td style={{padding:"8px 12px",borderBottom:"1px solid #f1f5f9",fontWeight:700,color:t.met?"#166534":"#dc2626",fontVariantNumeric:"tabular-nums"}}>{fDur(t.sla.totalMin)}</td>

      <td style={{padding:"8px 12px",borderBottom:"1px solid #f1f5f9"}}>{t.met?<Bdg bg="#dcfce7" color="#166534">Met ✓</Bdg>:t.isActive?<Bdg bg={bb.bg} color={bb.tx}>{bb.lb}</Bdg>:<Bdg bg="#fee2e2" color="#991b1b">Breached ✗</Bdg>}</td>
      <td style={{padding:"8px 12px",borderBottom:"1px solid #f1f5f9",fontSize:11}}>{t.closedAt?fDT(t.closedAt):fDT(t.createdAt)}</td>
    </tr>;})}</tbody></table></div>}
    <Pgn total={filt.length} page={pg} setPage={setPg}/>
  </div>;
}

function TrendA({closed,sevs,cfg,hs,clients}){const data=useMemo(()=>{const m={};closed.forEach(t=>{const mo=getMo(t.closedAt),sla=calcSLA(t,cfg,hs),tg=getTgt(t,sevs,clients);if(!m[mo])m[mo]={month:mo,total:0,met:0,sum:0};m[mo].total++;m[mo].sum+=sla.totalMin;if(sla.totalMin<=tg)m[mo].met++;});return Object.values(m).sort((a,b)=>a.month.localeCompare(b.month)).map(o=>({...o,comp:Math.round(o.met/o.total*100),avg:Math.round(o.sum/o.total)}));},[closed,sevs,cfg,hs,clients]);return<div>{data.length<2?<Card style={{textAlign:"center",padding:44,color:"#94a3b8"}}>Need at least 2 months of data</Card>:<ResponsiveContainer width="100%" height={300}><LineChart data={data}><CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9"/><XAxis dataKey="month" fontSize={11}/><YAxis fontSize={11}/><Tooltip/><Line type="monotone" dataKey="comp" stroke="#4f46e5" strokeWidth={2} name="Compliance %" dot={{fill:"#4f46e5"}}/><Line type="monotone" dataKey="total" stroke="#10b981" strokeWidth={2} name="Closed" dot={{fill:"#10b981"}}/></LineChart></ResponsiveContainer>}</div>;}

  const pfxValid=pfxUpper.length>0&&/^[A-Z]+$/.test(pfxUpper);

        {sevs.map(s=>{const val=overrides[s.id];const hasVal=val!=null&&val>0;
          return <div key={s.id} style={{padding:"10px 12px",borderRadius:8,border:"1px solid "+(hasVal?"#bbf7d0":"#fecaca"),background:hasVal?"#f0fdf4":"#fef2f2"}}>

              <div style={{width:10,height:10,borderRadius:3,background:s.color}}/>

}

function StsS({statuses,onSave,wfs}){
  const[list,setList]=useState([...statuses]);const[showAdd,setShowAdd]=useState(false);const[showBulk,setShowBulk]=useState(false);const[editIdx,setEditIdx]=useState(null);
  const add=s=>{setList([...list,{id:uid(),...s}]);setShowAdd(false);};
  const edit=(i,s)=>{const u=[...list];u[i]={...u[i],...s};setList(u);setEditIdx(null);};
  const del=i=>setList(list.filter((_,j)=>j!==i));
  const grp=useMemo(()=>{const m={svm:[],client:[],engineering:[]};list.forEach((s,i)=>{if(m[s.side])m[s.side].push({...s,idx:i});});return m;},[list]);
  return <Card>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
      <h3 style={{margin:0,fontSize:15,fontWeight:700}}>Statuses ({list.length})</h3>
      <div style={{display:"flex",gap:6}}><Btn small variant="outline" onClick={()=>setShowBulk(true)}><Plus size={12}/>Bulk Add</Btn><Btn small onClick={()=>setShowAdd(true)}><Plus size={12}/>Add Status</Btn></div>
    </div>
    {["svm","engineering","client"].map(side=><div key={side} style={{marginBottom:16}}><div style={{fontSize:13,fontWeight:700,color:SC[side],marginBottom:6,display:"flex",alignItems:"center",gap:6}}><div style={{width:10,height:10,borderRadius:3,background:SC[side]}}/>{SL[side]} ({grp[side].length})</div><div style={{display:"flex",flexDirection:"column",gap:3}}>{grp[side].map(s=><div key={s.id} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 10px",background:"#f8fafc",borderRadius:6,fontSize:12}}><span style={{flex:1,fontWeight:600}}>{s.name}</span><span style={{fontSize:10,color:"#94a3b8"}}>{(s.workflows||[]).map(w=>wfs.find(x=>x.id===w)?.name).filter(Boolean).join(", ")}</span><button onClick={()=>setEditIdx(s.idx)} style={{background:"none",border:"none",cursor:"pointer",color:"#94a3b8"}}><Edit2 size={12}/></button><button onClick={()=>del(s.idx)} style={{background:"none",border:"none",cursor:"pointer",color:"#94a3b8"}}><Trash2 size={12}/></button></div>)}</div></div>)}
    <div style={{marginTop:10}}><Btn onClick={()=>onSave(list)}><Save size={13}/>Save</Btn></div>
    <Modal open={showAdd} onClose={()=>setShowAdd(false)} title="Add Status"><StForm wfs={wfs} onSave={add} onCancel={()=>setShowAdd(false)}/></Modal>
    <Modal open={showBulk} onClose={()=>setShowBulk(false)} title="Bulk Add Statuses" wide><BulkStForm wfs={wfs} existing={list} onSave={arr=>{setList([...list,...arr]);setShowBulk(false);}} onCancel={()=>setShowBulk(false)}/></Modal>
    {editIdx!=null&&<Modal open={true} onClose={()=>setEditIdx(null)} title="Edit Status"><StForm initial={list[editIdx]} wfs={wfs} onSave={s=>edit(editIdx,s)} onCancel={()=>setEditIdx(null)}/></Modal>}
  </Card>;
}

function BulkStForm({wfs,existing,onSave,onCancel}){
  const[text,setText]=useState("");const[side,setSide]=useState("svm");const[selWfs,setSelWfs]=useState(wfs.map(w=>w.id));
  const tglWf=id=>setSelWfs(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const lines=text.split("\n").map(l=>l.trim()).filter(Boolean);
  const newOnes=lines.filter(n=>!existing.some(s=>s.name.toLowerCase()===n.toLowerCase()));
  const handle=()=>{const arr=newOnes.map(n=>({id:uid(),name:n,side,workflows:[...selWfs]}));onSave(arr);};
  return <div style={{display:"flex",flexDirection:"column",gap:12}}>
    <div style={{padding:10,background:"#f0f9ff",borderRadius:8,fontSize:12,color:"#1e40af"}}>Paste one status name per line. Duplicates are auto-skipped.</div>
    <textarea value={text} onChange={e=>setText(e.target.value)} rows={8} placeholder={"Open\nAcknowledged\nAnalysis & Study\n..."} style={{padding:10,borderRadius:7,border:"1px solid #e2e8f0",fontSize:13,fontFamily:"monospace",resize:"vertical"}}/>
    <div style={{display:"flex",gap:12}}>
      <Sel label="Side" value={side} onChange={e=>setSide(e.target.value)} options={[{value:"svm",label:"SVM"},{value:"client",label:"Client"},{value:"engineering",label:"Engineering"}]}/>
      <div><label style={{fontSize:11,fontWeight:600,color:"#64748b"}}>Workflows</label><div style={{display:"flex",gap:6,marginTop:4}}>{wfs.map(w=><button key={w.id} onClick={()=>tglWf(w.id)} style={{padding:"4px 10px",borderRadius:6,border:"1px solid "+(selWfs.includes(w.id)?"#4f46e5":"#e2e8f0"),background:selWfs.includes(w.id)?"#4f46e5":"#fff",color:selWfs.includes(w.id)?"#fff":"#475569",fontSize:11,fontWeight:600,cursor:"pointer"}}>{w.name}</button>)}</div></div>
    </div>
    <div style={{fontSize:12,color:"#64748b"}}>{lines.length} parsed · {newOnes.length} new · {lines.length-newOnes.length} duplicates skipped</div>
    <div style={{display:"flex",justifyContent:"flex-end",gap:8}}><Btn variant="secondary" onClick={onCancel}>Cancel</Btn><Btn onClick={handle} disabled={newOnes.length===0}><Plus size={13}/>Add {newOnes.length}</Btn></div>
  </div>;
}

function StForm({initial,wfs,onSave,onCancel}){
  const[name,setName]=useState(initial?.name||"");const[side,setSide]=useState(initial?.side||"svm");const[selWfs,setSelWfs]=useState(initial?.workflows||wfs.map(w=>w.id));
  const tglWf=id=>setSelWfs(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  return <div style={{display:"flex",flexDirection:"column",gap:12}}>
    <Inp label="Status Name" value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Analysis & Study"/>
    <Sel label="Side (timer behaviour)" value={side} onChange={e=>setSide(e.target.value)} options={[{value:"svm",label:"SVM (timer runs)"},{value:"client",label:"Client (timer paused)"},{value:"engineering",label:"Engineering (timer runs)"}]}/>
    <div><label style={{fontSize:11,fontWeight:600,color:"#64748b"}}>Applies to Workflows</label><div style={{display:"flex",gap:6,marginTop:6}}>{wfs.map(w=><button key={w.id} onClick={()=>tglWf(w.id)} style={{padding:"5px 12px",borderRadius:7,border:"1px solid "+(selWfs.includes(w.id)?"#4f46e5":"#e2e8f0"),background:selWfs.includes(w.id)?"#4f46e5":"#fff",color:selWfs.includes(w.id)?"#fff":"#475569",fontSize:12,fontWeight:600,cursor:"pointer"}}>{w.name}</button>)}</div></div>
    <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:6}}><Btn variant="secondary" onClick={onCancel}>Cancel</Btn><Btn onClick={()=>onSave({name:name.trim(),side,workflows:selWfs})} disabled={!name.trim()}><Save size={13}/>Save</Btn></div>
  </div>;
}
function SevS({sevs,onSave}){
  const[list,setList]=useState([...sevs]);const[showAdd,setShowAdd]=useState(false);const[editIdx,setEditIdx]=useState(null);
  const SevForm=({initial,onSave:fSave,onCancel:fCancel})=>{const[name,setName]=useState(initial?.name||"");const[hrs,setHrs]=useState(initial?.resolutionHours||0);const[color,setColor]=useState(initial?.color||"#6b7280");return<div style={{display:"flex",flexDirection:"column",gap:12}}><Inp label="Name" value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Critical"/><Inp label="Default Resolution Hours" type="number" value={hrs} onChange={e=>setHrs(+e.target.value)}/><Inp label="Color" type="color" value={color} onChange={e=>setColor(e.target.value)} style={{height:40}}/><div style={{display:"flex",justifyContent:"flex-end",gap:8}}><Btn variant="secondary" onClick={fCancel}>Cancel</Btn><Btn onClick={()=>fSave({name:name.trim(),resolutionHours:hrs,color})} disabled={!name.trim()}><Save size={13}/>Save</Btn></div></div>;};
  const add=s=>{setList([...list,{id:uid(),...s}]);setShowAdd(false);};
  const edit=(i,s)=>{const u=[...list];u[i]={...u[i],...s};setList(u);setEditIdx(null);};
  const del=i=>setList(list.filter((_,j)=>j!==i));
  return <Card><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}><h3 style={{margin:0,fontSize:15,fontWeight:700}}>Severity Levels</h3><Btn small onClick={()=>setShowAdd(true)}><Plus size={12}/>Add</Btn></div><div style={{display:"flex",flexDirection:"column",gap:6}}>{list.map((s,i)=><div key={s.id||i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 14px",background:"#f8fafc",borderRadius:8,fontSize:13}}><div style={{width:14,height:14,borderRadius:4,background:s.color}}/><span style={{flex:1,fontWeight:700}}>{s.name}</span><span style={{fontSize:12,color:"#64748b"}}>{s.resolutionHours}h default</span><button onClick={()=>setEditIdx(i)} style={{background:"none",border:"none",cursor:"pointer",color:"#94a3b8"}}><Edit2 size={13}/></button><button onClick={()=>del(i)} style={{background:"none",border:"none",cursor:"pointer",color:"#94a3b8"}}><Trash2 size={13}/></button></div>)}</div><div style={{marginTop:14}}><Btn onClick={()=>onSave(list)}><Save size={13}/>Save</Btn></div><Modal open={showAdd} onClose={()=>setShowAdd(false)} title="Add Severity"><SevForm onSave={add} onCancel={()=>setShowAdd(false)}/></Modal>{editIdx!=null&&<Modal open={true} onClose={()=>setEditIdx(null)} title="Edit Severity"><SevForm initial={list[editIdx]} onSave={s=>edit(editIdx,s)} onCancel={()=>setEditIdx(null)}/></Modal>}</Card>;
}
function BkpS({allData,onRestore,notify}){
  const hExport=()=>{const blob=new Blob([JSON.stringify(allData,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`SLA_Backup_${dYMD(new Date())}.json`;a.click();URL.revokeObjectURL(url);notify("Backup exported","info");};
  const hImport=e=>{const file=e.target.files?.[0];if(!file)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);onRestore(d);}catch(err){notify("Invalid JSON file","error");}};r.readAsText(file);};
  const hSyncUp=async()=>{try{const r=await window.storage.syncToCloud();notify(`Synced to cloud: ${r.saved||0} keys`,"info");}catch(e){notify("Sync failed: "+e.message,"error");}};
  const hSyncDown=async()=>{try{const r=await window.storage.syncFromCloud();notify(`Pulled from cloud: ${r.synced||0} keys. Refresh to see changes.`,"info");}catch(e){notify("Pull failed: "+e.message,"error");}};
  return <Card>
    <h3 style={{margin:"0 0 14px",fontSize:15,fontWeight:700}}>Backup & Restore</h3>
    <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
      <Btn onClick={hExport}><Download size={14}/>Export JSON</Btn>
      <label style={{display:"inline-flex",alignItems:"center",gap:5,padding:"8px 16px",borderRadius:8,border:"none",background:"#e2e8f0",color:"#334155",fontWeight:600,fontSize:13,cursor:"pointer"}}><Upload size={14}/>Import JSON<input type="file" accept=".json" onChange={hImport} hidden/></label>
    </div>
    <div style={{marginTop:16,paddingTop:14,borderTop:"1px solid #e2e8f0"}}>
      <h4 style={{margin:"0 0 8px",fontSize:13,fontWeight:700,color:"#334155"}}>Cloud Sync (Google Sheets)</h4>
      <p style={{fontSize:12,color:"#64748b",margin:"0 0 10px"}}>Sync data between this browser and your Google Sheet backend.</p>
      <div style={{display:"flex",gap:8}}>
        <Btn variant="outline" onClick={hSyncUp}><Upload size={14}/>Push to Cloud</Btn>
        <Btn variant="outline" onClick={hSyncDown}><Download size={14}/>Pull from Cloud</Btn>
      </div>
    </div>
  </Card>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
