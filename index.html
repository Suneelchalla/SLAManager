<script>
// ═══════════════════════════════════════════════════════════
//  CONFIGURATION — Paste your Apps Script Web App URL below
// ═══════════════════════════════════════════════════════════
var APPS_SCRIPT_URL = '';  // ← PASTE YOUR URL HERE
// e.g. 'https://script.google.com/macros/s/AKfycbx.../exec'
// ═══════════════════════════════════════════════════════════

// Hybrid storage: localStorage for speed + Apps Script for persistence
window.storage = {
  get: async function(k) {
    // Try localStorage first (instant)
    var v = localStorage.getItem(k);
    if (v !== null) return { key: k, value: v };
    // Fall back to Apps Script
    if (!APPS_SCRIPT_URL) return null;
    try {
      var resp = await fetch(APPS_SCRIPT_URL + '?action=get&key=' + encodeURIComponent(k));
      var data = await resp.json();
      if (data && data.value) {
        localStorage.setItem(k, data.value); // cache locally
        return data;
      }
    } catch (e) { console.warn('Apps Script get failed:', e); }
    return null;
  },
  set: async function(k, v) {
    // Save to localStorage immediately
    localStorage.setItem(k, v);
    // Push to Apps Script in background
    if (APPS_SCRIPT_URL) {
      try {
        fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'set', key: k, value: v })
        }).catch(function(e) { console.warn('Apps Script set failed:', e); });
      } catch (e) { console.warn('Apps Script set failed:', e); }
    }
    return { key: k, value: v };
  },
  delete: async function(k) {
    localStorage.removeItem(k);
    if (APPS_SCRIPT_URL) {
      try {
        fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'delete', key: k })
        }).catch(function(e) { console.warn('Apps Script delete failed:', e); });
      } catch (e) {}
    }
    return { key: k, deleted: true };
  },
  list: async function(p) {
    var keys = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (!p || k.startsWith(p)) keys.push(k);
    }
    return { keys: keys };
  },
  // Pull all data from Google Sheets → localStorage
  syncFromCloud: async function() {
    if (!APPS_SCRIPT_URL) return { synced: 0 };
    try {
      var resp = await fetch(APPS_SCRIPT_URL + '?action=getAll');
      var data = await resp.json();
      var count = 0;
      for (var k in data) {
        if (data.hasOwnProperty(k)) { localStorage.setItem(k, data[k]); count++; }
      }
      return { synced: count };
    } catch (e) { console.warn('Sync from cloud failed:', e); return { error: e.message }; }
  },
  // Push all sla: data from localStorage → Google Sheets
  syncToCloud: async function() {
    if (!APPS_SCRIPT_URL) return { saved: 0 };
    var payload = {};
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k.startsWith('sla:')) payload[k] = localStorage.getItem(k);
    }
    try {
      var resp = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'setAll', data: payload })
      });
      return await resp.json();
    } catch (e) { console.warn('Sync to cloud failed:', e); return { error: e.message }; }
  }
};
</script>

function getBizMin(sI,eI,cfg,hs){const s=new Date(sI),e=new Date(eI);if(s>=e)return 0;const bS=parseHM(cfg.businessStart),bE=parseHM(cfg.businessEnd),is24=bS===0&&bE>=1439;let t=0,c=new Date(s);while(c<e){const dw=c.getDay(),ym=dYMD(c);if(cfg.workDays.includes(dw)&&!hs.has(ym)){let dS,dE;if(is24){dS=new Date(c.getFullYear(),c.getMonth(),c.getDate(),0,0,0);dE=new Date(c.getFullYear(),c.getMonth(),c.getDate(),23,59,59);}else{dS=new Date(c.getFullYear(),c.getMonth(),c.getDate(),Math.floor(bS/60),bS%60,0);dE=new Date(c.getFullYear(),c.getMonth(),c.getDate(),Math.floor(bE/60),bE%60,0);}const sS=c>dS?c:dS,sE=e<dE?e:dE;if(sE>sS)t+=(sE-sS)/60000;}c=new Date(c.getFullYear(),c.getMonth(),c.getDate()+1,0,0,0);}return t;}
function calcSLA(tk,cfg,hs){if(!tk.history?.length)return{totalMin:0,clientMin:0,svmMin:0,engMin:0,perOwner:{},perSide:{svm:0,client:0,engineering:0}};const now=new Date();let tM=0,cM=0,sM=0,eM=0;const pO={},pS={svm:0,client:0,engineering:0};for(let i=0;i<tk.history.length;i++){const en=tk.history[i],sd=en.side||"svm",sS=new Date(en.timestamp);const paused=sd==="client"||en.statusName==="Closed";let sE;if(i<tk.history.length-1)sE=new Date(tk.history[i+1].timestamp);else if(tk.closedAt)sE=new Date(tk.closedAt);else sE=now;const mn=getBizMin(sS,sE,cfg,hs);if(paused)cM+=mn;else if(sd==="engineering"){eM+=mn;tM+=mn;}else{sM+=mn;tM+=mn;}pS[paused?"client":sd]=(pS[paused?"client":sd]||0)+mn;const ow=en.owner||"Unassigned";if(!paused)pO[ow]=(pO[ow]||0)+mn;}return{totalMin:tM,clientMin:cM,svmMin:sM,engMin:eM,perOwner:pO,perSide:pS};}
function bLvl(el,tg){if(tg<=0)return"safe";const p=el/tg;if(p>=1)return"breached";if(p>=.9)return"danger";if(p>=.75)return"warning";return"safe";}
function bBadge(l){return{safe:{bg:"#dcfce7",tx:"#166534",lb:"On Track"},warning:{bg:"#fef3c7",tx:"#92400e",lb:"At Risk"},danger:{bg:"#fee2e2",tx:"#991b1b",lb:"Critical"},breached:{bg:"#7f1d1d",tx:"#fff",lb:"Breached"}}[l]||{bg:"#dcfce7",tx:"#166534",lb:"On Track"};}
function getWk(d){const dt=new Date(d),j=new Date(dt.getFullYear(),0,1),w=Math.ceil(((dt-j)/864e5+j.getDay()+1)/7);return`${dt.getFullYear()}-W${String(w).padStart(2,"0")}`;}
function getMo(d){const dt=new Date(d);return`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}`;}
function useStore(key,def){const[data,setData]=useState(def);const[ld,setLd]=useState(false);useEffect(()=>{(async()=>{try{const r=await window.storage.get(key);if(r&&r.value)setData(JSON.parse(r.value));}catch(e){}setLd(true);})();},[key]);const save=useCallback(async v=>{setData(v);try{await window.storage.set(key,JSON.stringify(v));}catch(e){console.error(e);}},[key]);return[data,save,ld];}

/* ─── UI PRIMITIVES ─── */
const Bdg=({children,bg,color:c})=><span style={{background:bg,color:c,padding:"2px 10px",borderRadius:12,fontSize:11,fontWeight:600,whiteSpace:"nowrap",display:"inline-block"}}>{children}</span>;
const SBdg=({side})=><Bdg bg={SC[side]+"22"} color={SC[side]}>{SL[side]||side}</Bdg>;
function Btn({children,onClick,variant="primary",small,disabled,style:sx}){const v={primary:{background:"#4f46e5",color:"#fff"},secondary:{background:"#e2e8f0",color:"#334155"},danger:{background:"#fee2e2",color:"#991b1b"},success:{background:"#dcfce7",color:"#166534"},ghost:{background:"transparent",color:"#4f46e5"},escalate:{background:"#fef3c7",color:"#92400e"},outline:{background:"#fff",color:"#4f46e5",border:"1px solid #c7d2fe"}};return <button style={{padding:small?"4px 10px":"8px 16px",borderRadius:8,border:"none",fontWeight:600,fontSize:small?11:13,cursor:disabled?"not-allowed":"pointer",display:"inline-flex",alignItems:"center",gap:5,opacity:disabled?.5:1,...v[variant],...sx}} onClick={onClick} disabled={disabled}>{children}</button>;}
function Inp({label,...p}){return <div style={{display:"flex",flexDirection:"column",gap:3}}>{label&&<label style={{fontSize:11,fontWeight:600,color:"#64748b"}}>{label}</label>}<input {...p} style={{padding:"7px 11px",borderRadius:7,border:"1px solid #e2e8f0",fontSize:13,outline:"none",...p.style}}/></div>;}
function Sel({label,options=[],...p}){return <div style={{display:"flex",flexDirection:"column",gap:3}}>{label&&<label style={{fontSize:11,fontWeight:600,color:"#64748b"}}>{label}</label>}<select {...p} style={{padding:"7px 11px",borderRadius:7,border:"1px solid #e2e8f0",fontSize:13,outline:"none",background:"#fff",...p.style}}>{options.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}</select></div>;}
const Card=({children,style:sx,onClick})=><div onClick={onClick} style={{background:"#fff",borderRadius:12,padding:18,border:"1px solid #e9ecf2",cursor:onClick?"pointer":"default",...sx}}>{children}</div>;
function Modal({open,onClose,title,children,wide}){if(!open)return null;return <div style={{position:"fixed",inset:0,zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,.4)"}} onClick={onClose}><div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:16,padding:22,minWidth:380,maxWidth:wide?750:520,maxHeight:"88vh",overflow:"auto",boxShadow:"0 25px 60px rgba(0,0,0,.2)"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}><h3 style={{margin:0,fontSize:17,fontWeight:700}}>{title}</h3><button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",padding:4}}><X_ size={18}/></button></div>{children}</div></div>;}
function KPI({icon:Ic,label,value,sub,accent}){return <Card style={{display:"flex",gap:12,alignItems:"flex-start"}}><div style={{width:40,height:40,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",background:(accent||"#4f46e5")+"18"}}><Ic size={19} color={accent||"#4f46e5"}/></div><div><div style={{fontSize:22,fontWeight:800,lineHeight:1,color:"#0f172a"}}>{value}</div><div style={{fontSize:12,color:"#64748b",marginTop:3}}>{label}</div>{sub&&<div style={{fontSize:11,color:"#94a3b8",marginTop:1}}>{sub}</div>}</div></Card>;}
function Pgn({total,page,setPage}){const pages=Math.ceil(total/PGS);if(pages<=1)return null;return <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:4,marginTop:16}}><Btn small variant="secondary" disabled={page===1} onClick={()=>setPage(page-1)}>Prev</Btn>{Array.from({length:Math.min(pages,7)},(_,i)=>{let p;if(pages<=7)p=i+1;else if(page<=4)p=i+1;else if(page>=pages-3)p=pages-6+i;else p=page-3+i;return <button key={p} onClick={()=>setPage(p)} style={{width:32,height:32,borderRadius:6,border:"none",fontWeight:p===page?700:500,fontSize:13,cursor:"pointer",background:p===page?"#4f46e5":"transparent",color:p===page?"#fff":"#64748b"}}>{p}</button>;})}<Btn small variant="secondary" disabled={page===pages} onClick={()=>setPage(page+1)}>Next</Btn><span style={{fontSize:12,color:"#94a3b8",marginLeft:8}}>{total} items</span></div>;}
function STH({label,sk,sort,setSort}){const a=sort.key===sk;return <th onClick={()=>setSort({key:sk,dir:a&&sort.dir==="asc"?"desc":"asc"})} style={{textAlign:"left",padding:"9px 12px",background:"#f8fafc",borderBottom:"2px solid #e2e8f0",fontWeight:700,color:"#475569",fontSize:11,whiteSpace:"nowrap",cursor:"pointer",userSelect:"none"}}><span style={{display:"inline-flex",alignItems:"center",gap:4}}>{label}{a?(sort.dir==="asc"?<ArrowUp size={12}/>:<ArrowDown size={12}/>):<ArrowUpDown size={12} style={{opacity:.3}}/>}</span></th>;}
function DR({from,to,setFrom,setTo}){return <div style={{display:"flex",gap:8,alignItems:"flex-end"}}><Inp label="From" type="date" value={from} onChange={e=>setFrom(e.target.value)} style={{width:140}}/><Inp label="To" type="date" value={to} onChange={e=>setTo(e.target.value)} style={{width:140}}/>{(from||to)&&<Btn small variant="ghost" onClick={()=>{setFrom("");setTo("");}}>Clear</Btn>}</div>;}
function TTmr({ticket:tk,severities:svs,config:cfg,holidaySet:hs}){const[now,setNow]=useState(Date.now());useEffect(()=>{if(tk.closedAt)return;const iv=setInterval(()=>setNow(Date.now()),30000);return()=>clearInterval(iv);},[tk.closedAt]);const sla=useMemo(()=>calcSLA(tk,cfg,hs),[tk,cfg,hs,now]);const sv=svs.find(s=>s.id===tk.severity),tg=(sv?.resolutionHours||0)*60,rm=tg-sla.totalMin,lv=bLvl(sla.totalMin,tg),b=bBadge(lv);return <div style={{display:"flex",alignItems:"center",gap:8}}><Bdg bg={b.bg} color={b.tx}>{b.lb}</Bdg><span style={{fontSize:12,fontWeight:700,color:lv==="breached"?"#dc2626":"#0f172a",fontVariantNumeric:"tabular-nums"}}>{lv==="breached"?`+${fDur(Math.abs(rm))}`:`${fDur(rm)} left`}</span></div>;}
function Cfm({open,onClose,onConfirm,title,message}){return <Modal open={open} onClose={onClose} title={title||"Confirm"}><p style={{fontSize:14,color:"#334155",margin:"0 0 16px"}}>{message}</p><div style={{display:"flex",justifyContent:"flex-end",gap:8}}><Btn variant="secondary" onClick={onClose}>Cancel</Btn><Btn variant="danger" onClick={()=>{onConfirm();onClose();}}>Confirm</Btn></div></Modal>;}

  else if(page==="dashboard")content=<Dash tickets={tickets} active={active} closed={closed} sevs={sevs} teams={teams} modules={modules} cfg={cfg} hs={hs} onNav={nav} onSel={setSelTk}/>;

  else if(page==="escalations")content=<EscPanel tickets={escTix} sevs={sevs} teams={teams} cfg={cfg} hs={hs} onSel={setSelTk}/>;
  else if(page==="report")content=<Report tickets={closed} sevs={sevs} teams={teams} modules={modules} wfs={wfs} cfg={cfg} hs={hs} onSel={setSelTk}/>;

// ─── DASHBOARD ─────────────────────────────────────────────────
function Dash({tickets,active,closed,sevs,teams,modules,cfg,hs,onNav,onSel}){
  const[now,setNow]=useState(Date.now());const[dF,setDF]=useState("");const[dT,setDT]=useState("");
  useEffect(()=>{const iv=setInterval(()=>setNow(Date.now()),60000);return()=>clearInterval(iv);},[]);
  const fClosed=useMemo(()=>closed.filter(t=>{if(dF&&t.closedAt<dF)return false;if(dT&&t.closedAt>dT+"T23:59:59")return false;return true;}),[closed,dF,dT]);
  const stats=useMemo(()=>{let br=0,ar=0,ok=0,esc=0;active.forEach(t=>{const sla=calcSLA(t,cfg,hs),sv=sevs.find(s=>s.id===t.severity),lv=bLvl(sla.totalMin,(sv?.resolutionHours||0)*60);if(lv==="breached")br++;else if(lv==="danger"||lv==="warning")ar++;else ok++;if(t.isEscalated)esc++;});let cb=0;let totalResMin=0;fClosed.forEach(t=>{const sla=calcSLA(t,cfg,hs),sv=sevs.find(s=>s.id===t.severity);if(sla.totalMin>(sv?.resolutionHours||0)*60)cb++;totalResMin+=sla.totalMin;});const avgRes=fClosed.length?Math.round(totalResMin/fClosed.length):0;return{br,ar,ok,esc,cb,comp:fClosed.length?Math.round(((fClosed.length-cb)/fClosed.length)*100):100,avgRes};},[active,fClosed,sevs,cfg,hs,now]);
  const sevCh=useMemo(()=>sevs.map(s=>({name:s.name,active:active.filter(t=>t.severity===s.id).length,closed:fClosed.filter(t=>t.severity===s.id).length})),[active,fClosed,sevs]);
  const sideCh=useMemo(()=>{let sv=0,cl=0,en=0;active.forEach(t=>{const l=t.history?.[t.history.length-1];if(l?.side==="client")cl++;else if(l?.side==="engineering")en++;else sv++;});return[{name:"SVM",value:sv,color:SC.svm},{name:"Client",value:cl,color:SC.client},{name:"Engineering",value:en,color:SC.engineering}].filter(x=>x.value>0);},[active]);
  const brList=useMemo(()=>active.filter(t=>{const sla=calcSLA(t,cfg,hs),sv=sevs.find(s=>s.id===t.severity);return sla.totalMin>(sv?.resolutionHours||0)*60;}).sort((a,b)=>{const sa=calcSLA(a,cfg,hs),sb=calcSLA(b,cfg,hs),svA=sevs.find(s=>s.id===a.severity),svB=sevs.find(s=>s.id===b.severity);return(sb.totalMin-(svB?.resolutionHours||0)*60)-(sa.totalMin-(svA?.resolutionHours||0)*60);}).slice(0,8),[active,sevs,cfg,hs,now]);
  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20,flexWrap:"wrap",gap:12}}>
      <div><h1 style={{fontSize:22,fontWeight:800,color:"#0f172a",margin:0}}>Dashboard</h1><p style={{color:"#64748b",fontSize:13,margin:"3px 0 0"}}>SLA overview</p></div>
      <DR from={dF} to={dT} setFrom={setDF} setTo={setDT}/>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(175px,1fr))",gap:14,marginBottom:24}}>
      <KPI icon={Ticket} label="Active" value={active.length} accent="#4f46e5"/>
      <KPI icon={CheckCircle} label="On Track" value={stats.ok} accent="#10b981"/>
      <KPI icon={AlertTriangle} label="At Risk" value={stats.ar} accent="#f59e0b"/>
      <KPI icon={XCircle} label="Breached" value={stats.br} accent="#dc2626"/>
      <KPI icon={TrendingUp} label="Compliance" value={`${stats.comp}%`} sub={`${fClosed.length} closed`} accent="#10b981"/>
      <KPI icon={Flag} label="Escalated" value={stats.esc} accent="#ea580c"/>
      <KPI icon={Clock} label="Avg Resolution" value={fDur(stats.avgRes)} sub="closed tickets" accent="#6366f1"/>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:24}}>
      <Card><h3 style={{margin:"0 0 14px",fontSize:14,fontWeight:700}}>By Severity</h3><ResponsiveContainer width="100%" height={200}><BarChart data={sevCh}><CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9"/><XAxis dataKey="name" fontSize={11}/><YAxis fontSize={11} allowDecimals={false}/><Tooltip/><Bar dataKey="active" fill="#4f46e5" name="Active" radius={[3,3,0,0]}/><Bar dataKey="closed" fill="#10b981" name="Closed" radius={[3,3,0,0]}/></BarChart></ResponsiveContainer></Card>

// ─── TICKETS LIST ──────────────────────────────────────────────
function TkList({tickets,sevs,teams,modules,wfs,statuses,cfg,hs,onSel,allTix,onCreate,onBulk}){
  const[showC,setShowC]=useState(false);const[showI,setShowI]=useState(false);
  const[search,setSearch]=useState("");const[fS,setFS]=useState("");const[fT,setFT]=useState("");const[fW,setFW]=useState("");const[fM,setFM]=useState("");
  const[pg,setPg]=useState(1);const[sort,setSort]=useState({key:"urgency",dir:"asc"});
  const enr=useMemo(()=>tickets.map(t=>{const sla=calcSLA(t,cfg,hs),sv=sevs.find(s=>s.id===t.severity),tg=(sv?.resolutionHours||0)*60;return{...t,sla,sv,tg,rm:tg-sla.totalMin,lv:bLvl(sla.totalMin,tg)};}),[tickets,sevs,cfg,hs]);
  const filt=useMemo(()=>enr.filter(t=>{if(search&&!t.ticketNo.toLowerCase().includes(search.toLowerCase())&&!t.title.toLowerCase().includes(search.toLowerCase())&&!(t.currentOwner||"").toLowerCase().includes(search.toLowerCase()))return false;if(fS&&t.severity!==fS)return false;if(fT&&t.currentTeam!==fT)return false;if(fW&&t.workflow!==fW)return false;if(fM&&t.module!==fM)return false;return true;}),[enr,search,fS,fT,fW,fM]);
  const srt=useMemo(()=>[...filt].sort((a,b)=>{const d=sort.dir==="asc"?1:-1;if(sort.key==="urgency")return(a.rm-b.rm)*d;if(sort.key==="ticket")return a.ticketNo.localeCompare(b.ticketNo)*d;if(sort.key==="severity")return((a.sv?.resolutionHours||999)-(b.sv?.resolutionHours||999))*d;if(sort.key==="owner")return(a.currentOwner||"").localeCompare(b.currentOwner||"")*d;if(sort.key==="elapsed")return(a.sla.totalMin-b.sla.totalMin)*d;if(sort.key==="created")return(new Date(a.createdAt)-new Date(b.createdAt))*d;return 0;}),[filt,sort]);
  const pgd=srt.slice((pg-1)*PGS,pg*PGS);
  useEffect(()=>setPg(1),[search,fS,fT,fW,fM,sort]);
  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:10}}>
      <div><h1 style={{fontSize:22,fontWeight:800,color:"#0f172a",margin:0}}>Active Tickets</h1><p style={{color:"#64748b",fontSize:13,margin:"3px 0 0"}}>{filt.length} tickets</p></div>
      <div style={{display:"flex",gap:8}}><Btn variant="outline" onClick={()=>setShowI(true)}><Upload size={14}/>Bulk Import</Btn><Btn onClick={()=>setShowC(true)}><Plus size={14}/>New Ticket</Btn></div>
    </div>
    <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>

      <Sel value={fS} onChange={e=>setFS(e.target.value)} options={[{value:"",label:"All Severities"},...sevs.map(s=>({value:s.id,label:s.name}))]}/>
      <Sel value={fT} onChange={e=>setFT(e.target.value)} options={[{value:"",label:"All Teams"},...teams.map(t=>({value:t.id,label:t.name}))]}/>
      <Sel value={fW} onChange={e=>setFW(e.target.value)} options={[{value:"",label:"All Workflows"},...wfs.map(w=>({value:w.id,label:w.name}))]}/>
      <Sel value={fM} onChange={e=>setFM(e.target.value)} options={[{value:"",label:"All Modules"},...modules.map(m=>({value:m.id,label:m.name}))]}/>
      <Sel value={sort.key+"|"+sort.dir} onChange={e=>{const[k,d]=e.target.value.split("|");setSort({key:k,dir:d});}} options={[{value:"urgency|asc",label:"Most Urgent"},{value:"urgency|desc",label:"Least Urgent"},{value:"created|desc",label:"Newest"},{value:"created|asc",label:"Oldest"},{value:"severity|asc",label:"Highest Severity"},{value:"elapsed|desc",label:"Most Elapsed"}]}/>
    </div>
    {pgd.length===0?<Card style={{textAlign:"center",padding:44,color:"#94a3b8"}}>No active tickets{search?" matching search":""}.</Card>:
    <div style={{display:"flex",flexDirection:"column",gap:6}}>{pgd.map(t=>{const tm=teams.find(x=>x.id===t.currentTeam);const lH=t.history?.[t.history.length-1];const cSt=statuses.find(s=>s.id===lH?.statusId);
      return <Card key={t.id} onClick={()=>onSel(t.id)} style={{cursor:"pointer",padding:14,display:"flex",alignItems:"center",gap:14}}>
        <div style={{minWidth:90}}><div style={{fontWeight:800,fontSize:13}}>{t.ticketNo}</div><Bdg bg={t.sv?.color+"22"} color={t.sv?.color}>{t.sv?.name||"—"}</Bdg></div>
        <div style={{flex:1,minWidth:0}}><div style={{fontWeight:600,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.title}</div><div style={{fontSize:11,color:"#64748b",marginTop:2,display:"flex",gap:10,flexWrap:"wrap"}}><span>Owner: <b>{t.currentOwner||"—"}</b></span><span>Team: <b>{tm?.name||"—"}</b></span>{cSt&&<span>Status: <b>{cSt.name}</b> <SBdg side={lH?.side||"svm"}/></span>}</div></div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>{t.isEscalated&&<Bdg bg="#fef3c7" color="#92400e">Esc</Bdg>}<TTmr ticket={t} severities={sevs} config={cfg} holidaySet={hs}/><ChevronRight size={16} color="#94a3b8"/></div>
      </Card>;})}</div>}
    <Pgn total={filt.length} page={pg} setPage={setPg}/>
    <Modal open={showC} onClose={()=>setShowC(false)} title="Create New Ticket" wide><CrtForm statuses={statuses} teams={teams} modules={modules} sevs={sevs} wfs={wfs} allTix={allTix} onSave={t=>{onCreate(t);setShowC(false);}} onCancel={()=>setShowC(false)}/></Modal>
    <Modal open={showI} onClose={()=>setShowI(false)} title="Bulk Import from Excel" wide><BulkImp statuses={statuses} teams={teams} modules={modules} sevs={sevs} wfs={wfs} allTix={allTix} onImport={arr=>{onBulk(arr);setShowI(false);}} onCancel={()=>setShowI(false)}/></Modal>
  </div>;
}

function CrtForm({statuses,teams,modules,sevs,wfs,allTix,onSave,onCancel}){
  const[f,sF]=useState({ticketNo:"",title:"",desc:"",severity:sevs[0]?.id||"",module:modules[0]?.id||"",workflow:wfs[0]?.id||"",owner:"",team:teams[0]?.id||"",createdAt:new Date().toISOString().slice(0,16)});
  const set=(k,v)=>sF(p=>({...p,[k]:v}));
  const dup=allTix.some(t=>t.ticketNo.toLowerCase()===f.ticketNo.trim().toLowerCase());
  const save=()=>{if(!f.ticketNo.trim()||!f.title.trim()||dup)return;const wSts=statuses.filter(s=>s.workflows?.includes(f.workflow));const oSt=wSts.find(s=>s.name==="Open")||wSts[0];onSave({id:uid(),ticketNo:f.ticketNo.trim(),title:f.title.trim(),description:f.desc,severity:f.severity,module:f.module,workflow:f.workflow,currentOwner:f.owner.trim(),currentTeam:f.team,createdAt:new Date(f.createdAt).toISOString(),resolvedAt:null,closedAt:null,isEscalated:false,escalationHistory:[],history:[{id:uid(),statusId:oSt?.id||"",statusName:oSt?.name||"Open",side:oSt?.side||"svm",owner:f.owner.trim(),team:f.team,timestamp:new Date(f.createdAt).toISOString(),note:"Ticket created"}]});};
  return <div style={{display:"flex",flexDirection:"column",gap:12}}>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}><div><Inp label="Ticket No *" value={f.ticketNo} onChange={e=>set("ticketNo",e.target.value)} placeholder="e.g. SWIPHX-1234"/>{dup&&<span style={{fontSize:11,color:"#dc2626",fontWeight:600}}>Duplicate ticket number!</span>}</div><Inp label="Created" type="datetime-local" value={f.createdAt} onChange={e=>set("createdAt",e.target.value)}/></div>
    <Inp label="Title *" value={f.title} onChange={e=>set("title",e.target.value)} placeholder="Brief description"/>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}><Sel label="Workflow" value={f.workflow} onChange={e=>set("workflow",e.target.value)} options={wfs.map(w=>({value:w.id,label:w.name}))}/><Sel label="Severity" value={f.severity} onChange={e=>set("severity",e.target.value)} options={sevs.map(s=>({value:s.id,label:`${s.name} (${s.resolutionHours}h)`}))}/></div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}><Sel label="Module" value={f.module} onChange={e=>set("module",e.target.value)} options={modules.map(m=>({value:m.id,label:m.name}))}/><Sel label="Team" value={f.team} onChange={e=>set("team",e.target.value)} options={teams.map(t=>({value:t.id,label:t.name}))}/></div>
    <Inp label="Owner" value={f.owner} onChange={e=>set("owner",e.target.value)} placeholder="Person name"/>
    <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:6}}><Btn variant="secondary" onClick={onCancel}>Cancel</Btn><Btn onClick={save} disabled={!f.ticketNo.trim()||!f.title.trim()||dup}><Save size={13}/>Create</Btn></div>
  </div>;
}

function BulkImp({statuses,teams,modules,sevs,wfs,allTix,onImport,onCancel}){
  const[preview,setPrev]=useState([]);const[err,setErr]=useState("");const fR=useRef();
  const handle=e=>{const file=e.target.files?.[0];if(!file)return;const r=new FileReader();r.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:"array"}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws),ex=new Set(allTix.map(t=>t.ticketNo.toLowerCase()));const m=rows.map(r=>{const tN=(r["Ticket No"]||r["TicketNo"]||"").toString().trim(),tl=(r["Title"]||r["Summary"]||"").toString().trim(),svN=(r["Severity"]||r["Priority"]||"").toString().trim(),sv=sevs.find(s=>s.name.toLowerCase()===svN.toLowerCase()),wfN=(r["Workflow"]||"").toString().trim(),wf=wfs.find(w=>w.name.toLowerCase()===wfN.toLowerCase())||wfs[0],modN=(r["Module"]||"").toString().trim(),mod=modules.find(m=>m.name.toLowerCase()===modN.toLowerCase()),tmN=(r["Team"]||"").toString().trim(),tm=teams.find(t=>t.name.toLowerCase()===tmN.toLowerCase()),ow=(r["Owner"]||"").toString().trim(),cr=r["Created"]||new Date().toISOString(),isDup=ex.has(tN.toLowerCase());return{tN,tl,sv,wf,mod,tm,ow,cr,isDup,valid:!!tN&&!!tl&&!isDup&&!!sv};});setPrev(m);setErr("");}catch(err){setErr("Parse error: "+err.message);}};r.readAsArrayBuffer(file);};
  const doImp=()=>{const v=preview.filter(r=>r.valid).map(r=>{const oSt=statuses.find(s=>s.name==="Open"&&s.workflows?.includes(r.wf?.id))||statuses.find(s=>s.name==="Open");const ts=new Date(r.cr).toISOString();return{id:uid(),ticketNo:r.tN,title:r.tl,description:"",severity:r.sv?.id||"",module:r.mod?.id||"",workflow:r.wf?.id||"",currentOwner:r.ow,currentTeam:r.tm?.id||"",createdAt:ts,resolvedAt:null,closedAt:null,isEscalated:false,escalationHistory:[],history:[{id:uid(),statusId:oSt?.id||"",statusName:oSt?.name||"Open",side:oSt?.side||"svm",owner:r.ow,team:r.tm?.id||"",timestamp:ts,note:"Bulk imported"}]};});onImport(v);};
  const vc=preview.filter(r=>r.valid).length;
  return <div style={{display:"flex",flexDirection:"column",gap:12}}>
    <div style={{padding:14,background:"#f0f9ff",borderRadius:8,fontSize:13,color:"#1e40af"}}>Upload Excel with columns: <b>Ticket No, Title, Severity, Workflow, Module, Team, Owner, Created</b></div>
    <input ref={fR} type="file" accept=".xlsx,.xls,.csv" onChange={handle} style={{fontSize:13}}/>
    {err&&<div style={{color:"#dc2626",fontSize:13}}>{err}</div>}
    {preview.length>0&&<div><div style={{fontSize:13,fontWeight:600,marginBottom:8}}>{vc}/{preview.length} valid</div><div style={{maxHeight:250,overflow:"auto",border:"1px solid #e2e8f0",borderRadius:8}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}><thead><tr>{["","Ticket","Title","Severity","Workflow"].map(h=><th key={h} style={{padding:"6px 10px",background:"#f8fafc",borderBottom:"1px solid #e2e8f0",textAlign:"left",fontWeight:700,fontSize:11}}>{h}</th>)}</tr></thead><tbody>{preview.slice(0,50).map((r,i)=><tr key={i} style={{background:r.valid?"#fff":"#fef2f2"}}><td style={{padding:"5px 10px",borderBottom:"1px solid #f1f5f9"}}>{r.valid?"✅":r.isDup?"🔁":"❌"}</td><td style={{padding:"5px 10px",borderBottom:"1px solid #f1f5f9",fontWeight:600}}>{r.tN||"—"}</td><td style={{padding:"5px 10px",borderBottom:"1px solid #f1f5f9"}}>{r.tl||"—"}</td><td style={{padding:"5px 10px",borderBottom:"1px solid #f1f5f9"}}>{r.sv?.name||"❌"}</td><td style={{padding:"5px 10px",borderBottom:"1px solid #f1f5f9"}}>{r.wf?.name||"—"}</td></tr>)}</tbody></table></div></div>}
    <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:6}}><Btn variant="secondary" onClick={onCancel}>Cancel</Btn><Btn onClick={doImp} disabled={vc===0}><Upload size={13}/>Import {vc}</Btn></div>
  </div>;
}

// ─── TICKET DETAIL ─────────────────────────────────────────────
function TkDetail({ticket:tk,statuses,teams,severities:svs,modules,workflows:wfs,config:cfg,holidaySet:hs,onUpdate,onDelete,allTickets,onBack}){
  const[showSC,setShowSC]=useState(false);const[showEd,setShowEd]=useState(false);const[showDel,setShowDel]=useState(false);const[showClose,setShowClose]=useState(false);const[showEsc,setShowEsc]=useState(false);
  const[now,setNow]=useState(Date.now());
  useEffect(()=>{if(tk.closedAt)return;const iv=setInterval(()=>setNow(Date.now()),15000);return()=>clearInterval(iv);},[tk.closedAt]);
  const sla=useMemo(()=>calcSLA(tk,cfg,hs),[tk,cfg,hs,now]);
  const sv=svs.find(s=>s.id===tk.severity),tg=(sv?.resolutionHours||0)*60,rm=tg-sla.totalMin,lv=bLvl(sla.totalMin,tg),bb=bBadge(lv);
  const tm=teams.find(t=>t.id===tk.currentTeam),mod=modules.find(m=>m.id===tk.module),wf=wfs.find(w=>w.id===tk.workflow);
  const lH=tk.history?.[tk.history.length-1],cSt=statuses.find(s=>s.id===lH?.statusId),pct=tg>0?Math.min((sla.totalMin/tg)*100,100):0;
  const ageDays=Math.floor((new Date()-new Date(tk.createdAt))/864e5);
  const hEscSave=(reason)=>{const n=new Date().toISOString();onUpdate({...tk,isEscalated:!tk.isEscalated,escalationHistory:[...(tk.escalationHistory||[]),{action:tk.isEscalated?"de-escalated":"escalated",timestamp:n,reason:reason||""}]});setShowEsc(false);};
  const hClose=()=>{const cls=statuses.find(s=>s.name==="Closed"&&s.workflows?.includes(tk.workflow)),n=new Date().toISOString();onUpdate({...tk,closedAt:n,resolvedAt:tk.resolvedAt||n,history:[...tk.history,{id:uid(),statusId:cls?.id||"",statusName:"Closed",side:"svm",owner:tk.currentOwner,team:tk.currentTeam,timestamp:n,note:"Ticket closed"}]});setShowClose(false);};
  const hReopen=()=>{const rSt=statuses.find(s=>s.name==="Re-Open Review"&&s.workflows?.includes(tk.workflow))||statuses.find(s=>s.name==="Open"&&s.workflows?.includes(tk.workflow)),n=new Date().toISOString();onUpdate({...tk,closedAt:null,resolvedAt:null,history:[...tk.history,{id:uid(),statusId:rSt?.id||"",statusName:rSt?.name||"Re-Opened",side:"svm",owner:tk.currentOwner,team:tk.currentTeam,timestamp:n,note:"Reopened — timer resumed"}]});};
  const hSCSave=entry=>{const st=statuses.find(s=>s.id===entry.statusId);const isRes=st?.name?.toLowerCase().includes("resolved")||st?.name?.toLowerCase().includes("delivered")||st?.name?.toLowerCase().includes("completed");onUpdate({...tk,currentOwner:entry.owner||tk.currentOwner,currentTeam:entry.team||tk.currentTeam,resolvedAt:isRes?entry.timestamp:tk.resolvedAt,history:[...tk.history,entry]});setShowSC(false);};
  const hEdSave=u=>{onUpdate({...tk,...u});setShowEd(false);};
  const owBD=useMemo(()=>Object.entries(sla.perOwner).sort((a,b)=>b[1]-a[1]).map(([o,m])=>({owner:o,mins:m,pct:sla.totalMin>0?Math.round((m/sla.totalMin)*100):0})),[sla]);
  const hEl=useMemo(()=>{const a=[];let r=0;for(let i=0;i<tk.history.length;i++){if(i>0){const p=tk.history[i-1];const paused=p.side==="client"||p.statusName==="Closed";if(!paused)r+=getBizMin(p.timestamp,tk.history[i].timestamp,cfg,hs);}a.push(r);}return a;},[tk.history,cfg,hs]);
  return <div>
    <button onClick={onBack} style={{display:"flex",alignItems:"center",gap:5,background:"none",border:"none",color:"#4f46e5",cursor:"pointer",marginBottom:14,fontSize:13,fontWeight:600,padding:0}}><ArrowLeft size={15}/>Back</button>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:18,flexWrap:"wrap",gap:10}}>
      <div><div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}><h1 style={{fontSize:20,fontWeight:800,margin:0}}>{tk.ticketNo}</h1><Bdg bg={sv?.color+"22"} color={sv?.color}>{sv?.name}</Bdg><Bdg bg={bb.bg} color={bb.tx}>{bb.lb}</Bdg>{tk.isEscalated&&<Bdg bg="#fef3c7" color="#92400e">Escalated</Bdg>}{tk.closedAt&&<Bdg bg="#e2e8f0" color="#475569">Closed</Bdg>}<span style={{fontSize:11,color:"#94a3b8"}}>{ageDays}d old</span></div><p style={{color:"#334155",fontSize:15,margin:"5px 0 0",fontWeight:500}}>{tk.title}</p>{tk.description&&<p style={{color:"#64748b",fontSize:13,margin:"4px 0 0"}}>{tk.description}</p>}</div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}><Btn small variant="ghost" onClick={()=>setShowEd(true)}><Edit2 size={13}/>Edit</Btn>{tk.closedAt?<Btn small variant="outline" onClick={hReopen}><RotateCcw size={13}/>Reopen</Btn>:<><Btn small variant="escalate" onClick={()=>setShowEsc(true)}><Flag size={13}/>{tk.isEscalated?"De-escalate":"Escalate"}</Btn><Btn small variant="secondary" onClick={()=>setShowSC(true)}><RefreshCw size={13}/>Change Status</Btn><Btn small variant="danger" onClick={()=>setShowClose(true)}><XCircle size={13}/>Close</Btn></>}<Btn small variant="danger" onClick={()=>setShowDel(true)}><Trash2 size={13}/></Btn></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14,marginBottom:20}}>
      <Card><div style={{fontSize:11,color:"#64748b",fontWeight:600,marginBottom:6}}>SLA Timer</div><div style={{fontSize:26,fontWeight:800,color:lv==="breached"?"#dc2626":"#0f172a",lineHeight:1,fontVariantNumeric:"tabular-nums"}}>{fDur(sla.totalMin)}</div><div style={{fontSize:12,color:"#64748b",marginTop:5}}>of {fDur(tg)} target</div><div style={{height:5,background:"#e2e8f0",borderRadius:3,marginTop:8,overflow:"hidden"}}><div style={{height:"100%",borderRadius:3,width:`${Math.min(pct,100)}%`,background:BC[lv]}}/></div><div style={{fontSize:11,color:lv==="breached"?"#dc2626":"#64748b",marginTop:5,fontWeight:600}}>{lv==="breached"?`Overdue by ${fDur(Math.abs(rm))}`:`${fDur(rm)} remaining`}</div></Card>

function RemarksSection({ticket:tk,onUpdate}){
  const[text,setText]=useState("");
  const remarks=tk.remarks||[];
  const add=()=>{if(!text.trim())return;onUpdate({...tk,remarks:[...remarks,{id:uid(),text:text.trim(),timestamp:new Date().toISOString()}]});setText("");};
  const del=(rid)=>onUpdate({...tk,remarks:remarks.filter(r=>r.id!==rid)});
  return <Card style={{marginBottom:20}}>
    <h3 style={{margin:"0 0 12px",fontSize:14,fontWeight:700,display:"flex",alignItems:"center",gap:6}}><FileText size={15}/>Remarks ({remarks.length})</h3>
    <div style={{display:"flex",gap:8,marginBottom:12}}>
      <input value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")add();}} placeholder="Add a remark..." style={{flex:1,padding:"8px 12px",borderRadius:7,border:"1px solid #e2e8f0",fontSize:13,outline:"none"}}/>
      <Btn small onClick={add} disabled={!text.trim()}><Plus size={12}/>Add</Btn>
    </div>

    <div style={{display:"flex",flexDirection:"column",gap:6}}>{[...remarks].reverse().map(r=>
      <div key={r.id} style={{display:"flex",gap:10,padding:"8px 12px",background:"#f8fafc",borderRadius:7,fontSize:13}}>
        <div style={{flex:1}}><div style={{color:"#0f172a"}}>{r.text}</div><div style={{fontSize:11,color:"#94a3b8",marginTop:3}}>{fDT(r.timestamp)}</div></div>

function EscModal({open,onClose,isEscalated,onSave}){

// ─── SLA REPORT ────────────────────────────────────────────────
function Report({tickets,sevs,teams,modules,wfs,cfg,hs,onSel}){
  const[fS,setFS]=useState("");const[fB,setFB]=useState("");const[dF,setDF]=useState("");const[dT,setDT]=useState("");
  const[search,setSearch]=useState("");const[pg,setPg]=useState(1);const[sort,setSort]=useState({key:"closed",dir:"desc"});
  const enr=useMemo(()=>tickets.map(t=>{const sla=calcSLA(t,cfg,hs),sv=sevs.find(s=>s.id===t.severity),tg=(sv?.resolutionHours||0)*60,br=sla.totalMin>tg,ov=br?sla.totalMin-tg:0,lv=bLvl(sla.totalMin,tg);const mO=Object.entries(sla.perOwner).sort((a,b)=>b[1]-a[1])[0];const mS=Object.entries(sla.perSide).filter(([s])=>s!=="client").sort((a,b)=>b[1]-a[1])[0];return{...t,sla,sv,tg,br,ov,lv,mO,mS};}),[tickets,sevs,cfg,hs]);
  const filt=useMemo(()=>enr.filter(t=>{if(search&&!t.ticketNo.toLowerCase().includes(search.toLowerCase())&&!t.title.toLowerCase().includes(search.toLowerCase()))return false;if(fS&&t.severity!==fS)return false;if(fB==="breached"&&!t.br)return false;if(fB==="met"&&t.br)return false;if(dF&&t.closedAt<dF)return false;if(dT&&t.closedAt>dT+"T23:59:59")return false;return true;}),[enr,fS,fB,dF,dT,search]);
  const srt=useMemo(()=>[...filt].sort((a,b)=>{const d=sort.dir==="asc"?1:-1;if(sort.key==="ticket")return a.ticketNo.localeCompare(b.ticketNo)*d;if(sort.key==="severity")return((a.sv?.resolutionHours||999)-(b.sv?.resolutionHours||999))*d;if(sort.key==="elapsed")return(a.sla.totalMin-b.sla.totalMin)*d;if(sort.key==="target")return(a.tg-b.tg)*d;if(sort.key==="over")return(a.ov-b.ov)*d;if(sort.key==="closed")return((new Date(a.closedAt||0))-(new Date(b.closedAt||0)))*d;if(sort.key==="owner")return(a.currentOwner||"").localeCompare(b.currentOwner||"")*d;return 0;}),[filt,sort]);
  const pgd=srt.slice((pg-1)*PGS,pg*PGS);useEffect(()=>setPg(1),[search,fS,fB,dF,dT,sort]);const bC=filt.filter(t=>t.br).length;
  const hExp=()=>{const rows=srt.map(t=>{const tm=teams.find(x=>x.id===t.currentTeam),md=modules.find(x=>x.id===t.module),wf=wfs.find(x=>x.id===t.workflow);const reopens=t.history?t.history.filter(h=>h.statusName?.includes("Re-Open")||h.note?.includes("Reopened")).length:0;return{"Ticket No":t.ticketNo,Title:t.title,Severity:t.sv?.name||"",Workflow:wf?.name||"",Module:md?.name||"",Team:tm?.name||"",Owner:t.currentOwner,Escalated:t.isEscalated?"Yes":"No",Reopens:reopens,Created:fDT(t.createdAt),Closed:fDT(t.closedAt),"SLA Target hrs":t.sv?.resolutionHours||"","Elapsed hrs":+(t.sla.totalMin/60).toFixed(2),"SVM hrs":+(t.sla.svmMin/60).toFixed(2),"Engg hrs":+(t.sla.engMin/60).toFixed(2),"Client hrs":+(t.sla.clientMin/60).toFixed(2),Breached:t.br?"Yes":"No","Overdue hrs":t.br?+(t.ov/60).toFixed(2):"","Top Holder":t.mO?`${t.mO[0]} (${fDur(t.mO[1])})`:"","Breach Side":t.br?(t.mS?t.mS[0]:""):"N/A"};});const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"SLA Report");ws["!cols"]=Object.keys(rows[0]||{}).map(k=>({wch:Math.max(k.length,14)}));XLSX.writeFile(wb,`SLA_Report_${dYMD(new Date())}.xlsx`);};
  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:10}}>
      <div><h1 style={{fontSize:22,fontWeight:800,margin:0}}>SLA Report</h1><p style={{color:"#64748b",fontSize:13,margin:"3px 0 0"}}>{filt.length} closed · {bC} breached</p></div>
      <Btn onClick={hExp} disabled={!filt.length}><Download size={14}/>Export Excel</Btn>
    </div>
    <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap",alignItems:"flex-end"}}>
      <div style={{position:"relative",minWidth:160}}><Search size={15} style={{position:"absolute",left:10,top:9,color:"#94a3b8"}}/><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search..." style={{width:"100%",padding:"7px 11px 7px 34px",borderRadius:7,border:"1px solid #e2e8f0",fontSize:13,outline:"none",boxSizing:"border-box"}}/></div>
      <Sel value={fS} onChange={e=>setFS(e.target.value)} options={[{value:"",label:"All Severities"},...sevs.map(s=>({value:s.id,label:s.name}))]}/>
      <Sel value={fB} onChange={e=>setFB(e.target.value)} options={[{value:"",label:"All"},{value:"breached",label:"Breached"},{value:"met",label:"Met"}]}/>
      <DR from={dF} to={dT} setFrom={setDF} setTo={setDT}/>
    </div>
    {!pgd.length?<Card style={{textAlign:"center",padding:44,color:"#94a3b8"}}>No closed tickets matching filters.</Card>:
    <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"separate",borderSpacing:0,fontSize:12}}>
      <thead><tr><STH label="Ticket" sk="ticket" sort={sort} setSort={setSort}/><STH label="Severity" sk="severity" sort={sort} setSort={setSort}/><STH label="Owner" sk="owner" sort={sort} setSort={setSort}/><STH label="Elapsed" sk="elapsed" sort={sort} setSort={setSort}/><STH label="Target" sk="target" sort={sort} setSort={setSort}/><th style={{textAlign:"left",padding:"9px 12px",background:"#f8fafc",borderBottom:"2px solid #e2e8f0",fontWeight:700,color:"#475569",fontSize:11}}>Status</th><th style={{textAlign:"left",padding:"9px 12px",background:"#f8fafc",borderBottom:"2px solid #e2e8f0",fontWeight:700,color:"#475569",fontSize:11}}>SVM</th><th style={{textAlign:"left",padding:"9px 12px",background:"#f8fafc",borderBottom:"2px solid #e2e8f0",fontWeight:700,color:"#475569",fontSize:11}}>Engg</th><th style={{textAlign:"left",padding:"9px 12px",background:"#f8fafc",borderBottom:"2px solid #e2e8f0",fontWeight:700,color:"#475569",fontSize:11}}>Client</th><STH label="Over" sk="over" sort={sort} setSort={setSort}/><th style={{textAlign:"left",padding:"9px 12px",background:"#f8fafc",borderBottom:"2px solid #e2e8f0",fontWeight:700,color:"#475569",fontSize:11}}>Holder</th><STH label="Closed" sk="closed" sort={sort} setSort={setSort}/></tr></thead>
      <tbody>{pgd.map(t=>{const b=bBadge(t.lv);return <tr key={t.id} onClick={()=>onSel(t.id)} style={{cursor:"pointer"}}>
        <td style={{padding:"8px 12px",borderBottom:"1px solid #f1f5f9"}}><div style={{fontWeight:700}}>{t.ticketNo}</div><div style={{fontSize:11,color:"#64748b",maxWidth:160,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.title}</div></td>

function OwnerA({closed,sevs,cfg,hs}){
  const data=useMemo(()=>{const m={};closed.forEach(t=>{const sla=calcSLA(t,cfg,hs),sv=sevs.find(s=>s.id===t.severity),tg=(sv?.resolutionHours||0)*60,br=sla.totalMin>tg;const owners=Object.entries(sla.perOwner);const topOwner=owners.length?owners.sort((a,b)=>b[1]-a[1])[0][0]:null;owners.forEach(([o,mn])=>{if(!m[o])m[o]={owner:o,totalMin:0,tickets:0,breached:0};m[o].totalMin+=mn;m[o].tickets++;if(br&&o===topOwner)m[o].breached++;});});return Object.values(m).map(o=>({...o,avgMin:o.tickets?Math.round(o.totalMin/o.tickets):0,bPct:o.tickets?Math.round((o.breached/o.tickets)*100):0})).sort((a,b)=>b.totalMin-a.totalMin);},[closed,sevs,cfg,hs]);
  if(!data.length)return <Card style={{textAlign:"center",padding:44,color:"#94a3b8"}}>No data. Close tickets first.</Card>;
  const cd=data.slice(0,12).map(d=>({name:d.owner,total:Math.round(d.totalMin/60),avg:Math.round(d.avgMin/60)}));
  return <div>

    <Card><table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}><thead><tr>{["Owner","Tickets","Total","Avg/Ticket","Breached","Breach %","Rating"].map(h=><th key={h} style={{textAlign:"left",padding:"8px 12px",background:"#f8fafc",borderBottom:"2px solid #e2e8f0",fontSize:11,fontWeight:700,color:"#475569"}}>{h}</th>)}</tr></thead><tbody>{data.map(d=><tr key={d.owner}><td style={{padding:"8px 12px",borderBottom:"1px solid #f1f5f9",fontWeight:600}}>{d.owner}</td><td style={{padding:"8px 12px",borderBottom:"1px solid #f1f5f9"}}>{d.tickets}</td><td style={{padding:"8px 12px",borderBottom:"1px solid #f1f5f9",fontVariantNumeric:"tabular-nums"}}>{fDur(d.totalMin)}</td><td style={{padding:"8px 12px",borderBottom:"1px solid #f1f5f9",fontVariantNumeric:"tabular-nums"}}>{fDur(d.avgMin)}</td><td style={{padding:"8px 12px",borderBottom:"1px solid #f1f5f9",color:d.breached?"#dc2626":"#10b981",fontWeight:600}}>{d.breached}</td><td style={{padding:"8px 12px",borderBottom:"1px solid #f1f5f9"}}><Bdg bg={d.bPct>30?"#fee2e2":d.bPct>15?"#fef3c7":"#dcfce7"} color={d.bPct>30?"#991b1b":d.bPct>15?"#92400e":"#166534"}>{d.bPct}%</Bdg></td><td style={{padding:"8px 12px",borderBottom:"1px solid #f1f5f9"}}><Bdg bg={d.bPct<=15?"#dcfce7":"#fee2e2"} color={d.bPct<=15?"#166534":"#991b1b"}>{d.bPct<=15?"Efficient":d.bPct<=30?"Average":"Needs Work"}</Bdg></td></tr>)}</tbody></table></Card>
  </div>;
}

function TeamA({closed,teams,sevs,cfg,hs}){
  const data=useMemo(()=>{const m={};closed.forEach(t=>{const sla=calcSLA(t,cfg,hs),sv=sevs.find(s=>s.id===t.severity),tg=(sv?.resolutionHours||0)*60,br=sla.totalMin>tg,ti=t.currentTeam||"?",tm=teams.find(x=>x.id===ti);if(!m[ti])m[ti]={team:tm?.name||"Unknown",totalMin:0,tickets:0,breached:0};m[ti].totalMin+=sla.totalMin;m[ti].tickets++;if(br)m[ti].breached++;});return Object.values(m).map(d=>({...d,avgMin:d.tickets?Math.round(d.totalMin/d.tickets):0,comp:d.tickets?Math.round(((d.tickets-d.breached)/d.tickets)*100):100})).sort((a,b)=>b.tickets-a.tickets);},[closed,teams,sevs,cfg,hs]);

  </div>;

function ModA({closed,modules,sevs,cfg,hs}){
  const data=useMemo(()=>{const m={};closed.forEach(t=>{const sla=calcSLA(t,cfg,hs),sv=sevs.find(s=>s.id===t.severity),tg=(sv?.resolutionHours||0)*60,br=sla.totalMin>tg,mi=t.module||"?",mod=modules.find(x=>x.id===mi);if(!m[mi])m[mi]={module:mod?.name||"Unknown",tickets:0,breached:0,totalMin:0};m[mi].tickets++;m[mi].totalMin+=sla.totalMin;if(br)m[mi].breached++;});return Object.values(m).map(d=>({...d,avgMin:d.tickets?Math.round(d.totalMin/d.tickets):0,bPct:d.tickets?Math.round((d.breached/d.tickets)*100):0})).sort((a,b)=>b.bPct-a.bPct);},[closed,modules,sevs,cfg,hs]);

function TrendA({closed,sevs,cfg,hs}){
  const[mode,setMode]=useState("weekly");
  const data=useMemo(()=>{const m={};closed.forEach(t=>{const k=mode==="weekly"?getWk(t.closedAt):getMo(t.closedAt),sla=calcSLA(t,cfg,hs),sv=sevs.find(s=>s.id===t.severity),tg=(sv?.resolutionHours||0)*60,br=sla.totalMin>tg;if(!m[k])m[k]={period:k,total:0,breached:0,met:0};m[k].total++;if(br)m[k].breached++;else m[k].met++;});return Object.values(m).sort((a,b)=>a.period.localeCompare(b.period)).map(d=>({...d,comp:d.total?Math.round((d.met/d.total)*100):100}));},[closed,sevs,cfg,hs,mode]);
  if(!data.length)return <Card style={{textAlign:"center",padding:44,color:"#94a3b8"}}>No trend data.</Card>;

    <Card><h3 style={{margin:"0 0 12px",fontSize:14,fontWeight:700}}>Met vs Breached</h3><ResponsiveContainer width="100%" height={220}><BarChart data={data}><CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9"/><XAxis dataKey="period" fontSize={11}/><YAxis fontSize={11} allowDecimals={false}/><Tooltip/><Bar dataKey="met" stackId="a" fill="#10b981" name="Met"/><Bar dataKey="breached" stackId="a" fill="#dc2626" name="Breached" radius={[3,3,0,0]}/></BarChart></ResponsiveContainer></Card>
  </div>;
}

function SideA({closed,sevs,cfg,hs}){
  const data=useMemo(()=>{let sT=0,eT=0,cT=0,sB=0,eB=0;closed.forEach(t=>{const sla=calcSLA(t,cfg,hs),sv=sevs.find(s=>s.id===t.severity),tg=(sv?.resolutionHours||0)*60,br=sla.totalMin>tg;sT+=sla.svmMin;eT+=sla.engMin;cT+=sla.clientMin;if(br){if(sla.svmMin>=sla.engMin)sB++;else eB++;}});return{sT,eT,cT,sB,eB,total:closed.length};},[closed,sevs,cfg,hs]);
  const pie=[{name:"SVM",value:Math.round(data.sT/60),color:SC.svm},{name:"Engineering",value:Math.round(data.eT/60),color:SC.engineering},{name:"Client",value:Math.round(data.cT/60),color:SC.client}].filter(x=>x.value>0);
  return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
    <Card><h3 style={{margin:"0 0 12px",fontSize:14,fontWeight:700}}>Time Distribution (hours)</h3>{pie.length?<ResponsiveContainer width="100%" height={250}><PieChart><Pie data={pie} cx="50%" cy="50%" outerRadius={90} dataKey="value" label={({name,value})=>`${name}: ${value}h`}>{pie.map((e,i)=><Cell key={i} fill={e.color}/>)}</Pie><Tooltip/></PieChart></ResponsiveContainer>:<div style={{textAlign:"center",padding:40,color:"#94a3b8"}}>No data</div>}</Card>
    <Card><h3 style={{margin:"0 0 12px",fontSize:14,fontWeight:700}}>Breach Responsibility</h3><p style={{fontSize:13,color:"#64748b",margin:"0 0 12px"}}>Which side held the ticket longest when SLA breached?</p>{[{l:"SVM caused breach",c:data.sB,cl:SC.svm},{l:"Engineering caused breach",c:data.eB,cl:SC.engineering}].map(s=><div key={s.l} style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}><div style={{width:12,height:12,borderRadius:3,background:s.cl}}/><span style={{flex:1,fontSize:13}}>{s.l}</span><span style={{fontSize:18,fontWeight:800}}>{s.c}</span></div>)}<div style={{marginTop:12,padding:10,background:"#f8fafc",borderRadius:8,fontSize:12,color:"#64748b"}}>Total closed: {data.total} · Total breached: {data.sB+data.eB}</div></Card>
  </div>;
}

function StsS({statuses,saveSts,wfs}){
  const[show,setShow]=useState(false);const[eId,setEId]=useState(null);const[fW,setFW]=useState("");const[fSd,setFSd]=useState("");
  const filt=statuses.filter(s=>{if(fW&&!s.workflows?.includes(fW))return false;if(fSd&&s.side!==fSd)return false;return true;});
  const grp={svm:[],client:[],engineering:[]};filt.forEach(s=>{if(grp[s.side])grp[s.side].push(s);});
  const saveSt=u=>{if(eId)saveSts(statuses.map(s=>s.id===eId?u:s));else saveSts([...statuses,{...u,id:uid()}]);setShow(false);setEId(null);};
  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:8}}>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}><Sel value={fW} onChange={e=>setFW(e.target.value)} options={[{value:"",label:"All Workflows"},...wfs.map(w=>({value:w.id,label:w.name}))]}/>
      <Sel value={fSd} onChange={e=>setFSd(e.target.value)} options={[{value:"",label:"All Sides"},{value:"svm",label:"SVM"},{value:"client",label:"Client"},{value:"engineering",label:"Engineering"}]}/></div>
      <Btn onClick={()=>{setEId(null);setShow(true);}}><Plus size={13}/>Add</Btn>
    </div>
    {["svm","client","engineering"].map(side=>grp[side].length>0&&<Card key={side} style={{marginBottom:14}}>
      <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:10}}><div style={{width:11,height:11,borderRadius:3,background:SC[side]}}/><h3 style={{margin:0,fontSize:14,fontWeight:700}}>{SL[side]} <span style={{fontWeight:400,color:"#94a3b8"}}>({side==="client"?"Paused":"Runs"})</span></h3><Bdg bg={SC[side]+"22"} color={SC[side]}>{grp[side].length}</Bdg></div>
      <div style={{display:"flex",flexWrap:"wrap",gap:5}}>{grp[side].map(s=><div key={s.id} style={{display:"flex",alignItems:"center",gap:5,padding:"4px 9px",background:SC[side]+"0c",border:"1px solid "+SC[side]+"33",borderRadius:5,fontSize:12}}>{s.name}<button onClick={()=>{setEId(s.id);setShow(true);}} style={{background:"none",border:"none",cursor:"pointer",color:"#64748b",padding:1}}><Edit2 size={11}/></button><button onClick={()=>saveSts(statuses.filter(x=>x.id!==s.id))} style={{background:"none",border:"none",cursor:"pointer",color:"#ef4444",padding:1}}><Trash2 size={11}/></button></div>)}</div>
    </Card>)}
    <Modal open={show} onClose={()=>{setShow(false);setEId(null);}} title={eId?"Edit Status":"Add Status"}><StForm initial={eId?statuses.find(s=>s.id===eId):null} wfs={wfs} onSave={saveSt} onCancel={()=>{setShow(false);setEId(null);}}/></Modal>
  </div>;
}

function StForm({initial,wfs,onSave,onCancel}){
  const[f,sF]=useState(initial||{name:"",side:"svm",workflows:wfs.map(w=>w.id)});
  const set=(k,v)=>sF(p=>({...p,[k]:v}));const togW=w=>sF(p=>({...p,workflows:p.workflows?.includes(w)?p.workflows.filter(x=>x!==w):[...(p.workflows||[]),w]}));
  return <div style={{display:"flex",flexDirection:"column",gap:12}}>
    <Inp label="Status Name" value={f.name} onChange={e=>set("name",e.target.value)} placeholder="e.g. Development in Progress"/>
    <Sel label="Side" value={f.side} onChange={e=>set("side",e.target.value)} options={[{value:"svm",label:"SVM — Timer Runs"},{value:"engineering",label:"Engineering — Timer Runs"},{value:"client",label:"Client — Timer Paused"}]}/>
    <div><label style={{fontSize:11,fontWeight:600,color:"#64748b",display:"block",marginBottom:5}}>Workflows</label><div style={{display:"flex",flexWrap:"wrap",gap:5}}>{wfs.map(w=><button key={w.id} onClick={()=>togW(w.id)} style={{padding:"4px 10px",borderRadius:5,fontSize:12,fontWeight:600,cursor:"pointer",border:"1px solid "+(f.workflows?.includes(w.id)?"#4f46e5":"#e2e8f0"),background:f.workflows?.includes(w.id)?"#4f46e520":"#fff",color:f.workflows?.includes(w.id)?"#4f46e5":"#475569"}}>{w.name}</button>)}</div></div>
    <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:6}}><Btn variant="secondary" onClick={onCancel}>Cancel</Btn><Btn onClick={()=>onSave(f)} disabled={!f.name.trim()}><Save size={13}/>Save</Btn></div>
  </div>;
}

function SevS({sevs,saveSevs}){
  const[eId,setEId]=useState(null);const[f,sF]=useState({});
  const sE=s=>{setEId(s.id);sF({...s});};
  const sv=()=>{saveSevs(sevs.map(s=>s.id===eId?{...f,resolutionHours:Number(f.resolutionHours)}:s));setEId(null);};
  return <Card>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}><h3 style={{margin:0,fontWeight:700,fontSize:15}}>Severity / SLA</h3><Btn small onClick={()=>{const s={id:uid(),name:"New",resolutionHours:24,color:"#6b7280"};saveSevs([...sevs,s]);sE(s);}}><Plus size={13}/>Add</Btn></div>
    <div style={{padding:"8px 12px",background:"#f0f9ff",borderRadius:7,fontSize:12,color:"#1e40af",marginBottom:12}}>Resolution SLA only. Timer counts biz hours on SVM/Engineering side.</div>
    <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}><thead><tr>{["Severity","Resolution (hrs)","Color",""].map(h=><th key={h} style={{textAlign:"left",padding:"7px 10px",background:"#f8fafc",borderBottom:"2px solid #e2e8f0",fontSize:11,fontWeight:700,color:"#475569"}}>{h}</th>)}</tr></thead>
    <tbody>{sevs.map(s=><tr key={s.id}>
      <td style={{padding:"7px 10px",borderBottom:"1px solid #f1f5f9"}}>{eId===s.id?<input value={f.name} onChange={e=>sF(p=>({...p,name:e.target.value}))} style={{padding:"3px 7px",border:"1px solid #e2e8f0",borderRadius:5,fontSize:13}}/>:<Bdg bg={s.color+"22"} color={s.color}>{s.name}</Bdg>}</td>
      <td style={{padding:"7px 10px",borderBottom:"1px solid #f1f5f9"}}>{eId===s.id?<input type="number" value={f.resolutionHours} onChange={e=>sF(p=>({...p,resolutionHours:e.target.value}))} style={{padding:"3px 7px",border:"1px solid #e2e8f0",borderRadius:5,fontSize:13,width:70}}/>:<b>{s.resolutionHours}h</b>}</td>
      <td style={{padding:"7px 10px",borderBottom:"1px solid #f1f5f9"}}>{eId===s.id?<input type="color" value={f.color} onChange={e=>sF(p=>({...p,color:e.target.value}))} style={{width:36,height:26,border:"none"}}/>:<div style={{width:22,height:22,borderRadius:5,background:s.color}}/>}</td>
      <td style={{padding:"7px 10px",borderBottom:"1px solid #f1f5f9",textAlign:"right"}}>{eId===s.id?<div style={{display:"flex",gap:5,justifyContent:"flex-end"}}><Btn small onClick={sv}><Save size={11}/></Btn><Btn small variant="secondary" onClick={()=>setEId(null)}>Cancel</Btn></div>:<div style={{display:"flex",gap:5,justifyContent:"flex-end"}}><Btn small variant="ghost" onClick={()=>sE(s)}><Edit2 size={11}/></Btn><Btn small variant="danger" onClick={()=>saveSevs(sevs.filter(x=>x.id!==s.id))}><Trash2 size={11}/></Btn></div>}</td>
    </tr>)}</tbody></table>
  </Card>;
}

function BkpS({allData,onRestore}){
  const[msg,setMsg]=useState("");
  const[syncing,setSyncing]=useState(false);
  const hasCloud=!!window.APPS_SCRIPT_URL;
  const hExp=()=>{const j=JSON.stringify(allData,null,2),b=new Blob([j],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=`SLA_Backup_${dYMD(new Date())}.json`;a.click();URL.revokeObjectURL(u);setMsg("Backup exported!");setTimeout(()=>setMsg(""),3000);};
  const hImp=e=>{const file=e.target.files?.[0];if(!file)return;const r=new FileReader();r.onload=ev=>{try{onRestore(JSON.parse(ev.target.result));setMsg("Restored! Refresh to see all changes.");setTimeout(()=>setMsg(""),5000);}catch(err){setMsg("Error: "+err.message);}};r.readAsText(file);};
  const hPush=async()=>{setSyncing(true);try{const r=await window.storage.syncToCloud();setMsg(r.error?"Sync failed: "+r.error:"Pushed "+r.saved+" items to Google Sheets!");}catch(e){setMsg("Error: "+e.message);}setSyncing(false);setTimeout(()=>setMsg(""),4000);};
  const hPull=async()=>{setSyncing(true);try{const r=await window.storage.syncFromCloud();setMsg(r.error?"Sync failed: "+r.error:"Pulled "+r.synced+" items from Google Sheets! Refresh the page.");}catch(e){setMsg("Error: "+e.message);}setSyncing(false);setTimeout(()=>setMsg(""),5000);};
  return <Card>
    <h3 style={{margin:"0 0 14px",fontWeight:700,fontSize:15}}>Backup & Restore</h3>
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      {hasCloud&&<div style={{padding:14,background:"#f0fdf4",borderRadius:8,border:"1px solid #bbf7d0"}}>
        <div style={{fontSize:13,fontWeight:700,color:"#166534",marginBottom:8,display:"flex",alignItems:"center",gap:6}}><Database size={15}/>Google Sheets Sync</div>
        <p style={{fontSize:12,color:"#166534",margin:"0 0 10px"}}>Connected to Google Sheets. Data auto-saves on every change. Use these buttons for manual full sync.</p>
        <div style={{display:"flex",gap:8}}><Btn small variant="success" onClick={hPush} disabled={syncing}><Upload size={12}/>{syncing?"Syncing...":"Push All → Sheets"}</Btn><Btn small variant="outline" onClick={hPull} disabled={syncing}><Download size={12}/>{syncing?"Syncing...":"Pull All ← Sheets"}</Btn></div>
      </div>}
      {!hasCloud&&<div style={{padding:14,background:"#fefce8",borderRadius:8,border:"1px solid #fde68a"}}>
        <div style={{fontSize:13,fontWeight:600,color:"#92400e",marginBottom:4}}>Google Sheets not connected</div>
        <p style={{fontSize:12,color:"#a16207",margin:0}}>Data is stored in browser localStorage only. To enable cloud sync, add your Apps Script URL to the HTML file. See the setup guide.</p>
      </div>}
      <div><div style={{fontSize:13,fontWeight:600,marginBottom:6}}>Export Backup (JSON)</div><p style={{fontSize:12,color:"#64748b",margin:"0 0 8px"}}>Download all data as JSON file.</p><Btn onClick={hExp}><Download size={13}/>Export</Btn></div>
      <div style={{borderTop:"1px solid #e2e8f0",paddingTop:16}}><div style={{fontSize:13,fontWeight:600,marginBottom:6}}>Restore from Backup</div><p style={{fontSize:12,color:"#64748b",margin:"0 0 8px"}}>Upload a JSON backup. Overwrites existing data.</p><input type="file" accept=".json" onChange={hImp} style={{fontSize:13}}/></div>
      {msg&&<div style={{padding:"8px 12px",background:msg.includes("Error")||msg.includes("failed")?"#fee2e2":"#dcfce7",borderRadius:7,fontSize:13,color:msg.includes("Error")||msg.includes("failed")?"#991b1b":"#166534",fontWeight:600}}>{msg}</div>}
    </div>
  </Card>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
